<head>

<!-- site pessoal: o link funciona e a prévia aparece, mas fica fora das buscas -->

<meta property="og:url" content="https://aniversario.lucasjrdev.com/">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preload" as="image" href="img/vila.webp">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --night:#121833; --wood:#4a2c17; --wood2:#2a180b; --gold:#e3ae4a; --gold2:#ffe3a1; --gold3:#9a6a1f;
    --parch:#f6e9c8; --parch2:#e8cf98; --ink:#2b1c10; --ink2:#5a432c; --ruby:#a8323f; --ruby2:#7d1f2c; --emerald:#2f8f5b; }
  * { box-sizing:border-box; }
  html { background:var(--night); overflow-x:clip; }
  body { margin:0; min-height:100vh; min-height:100dvh; font:500 18px/1.5 'Alegreya Sans', system-ui, sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:16px 20px 40px; }
  body::before { content:''; position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, #0b0f24cc 0%, #0b0f2455 35%, #0b0f24aa 100%); }
  .bg { position:fixed; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:62% center; background:var(--night) url(img/cenario.webp) 62% center / cover; }
  main { width:100%; max-width:540px; }

  /* HUD: retrato, nível e XP */
  .hud { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; padding:8px 14px 8px 8px; border-radius:16px;
    background:linear-gradient(180deg, #5a3820, var(--wood2)); border:2px solid var(--gold3); box-shadow:inset 0 1px 0 #ffffff26, 0 8px 20px #0009; color:var(--parch); }
  .portrait { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #33407e, #121833);
    border:3px solid var(--gold); box-shadow:0 0 0 2px var(--wood2); }
  .portrait img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .who .row { display:flex; align-items:baseline; gap:8px; margin-bottom:5px; }
  .who b { font:800 18px Alegreya, Georgia, serif; color:var(--gold2); }
  .lv { font-weight:800; font-size:13px; color:#2a1a06; background:linear-gradient(#ffe79a, var(--gold)); border-radius:999px; padding:1px 9px; }
  .xpn { margin-left:auto; font-weight:800; font-size:14px; color:var(--gold2); }
  .bar { height:14px; border-radius:999px; border:2px solid var(--gold3); background:#00000080; overflow:hidden; box-shadow:inset 0 2px 4px #000a; }
  .bar i { display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.2,.9,.3,1.2);
    background:linear-gradient(180deg, #fff2bf 0%, #f0c45c 45%, #b9802a 100%); box-shadow:0 0 10px #f0c45c; }

  /* mapa das missões */
  .map { list-style:none; display:flex; justify-content:space-between; position:relative; margin:14px 4px 0; padding:0; }
  .map::before { content:''; position:absolute; left:28px; right:28px; top:27px; border-top:3px dashed #e3ae4a99; }
  .map li { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; width:64px; }
  .map span { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; position:relative;
    background:radial-gradient(circle at 50% 35%, #2c366e, #121833); border:3px solid #6b5a3a; box-shadow:0 4px 10px #0008; transition:.3s; }
  .map img { width:42px; height:42px; }
  .map small { font-size:12px; font-weight:800; color:var(--parch); text-shadow:0 1px 3px #000; }
  .map .locked img { filter:grayscale(1) brightness(.55); }
  .map .locked small { opacity:.6; }
  .map .on span { border-color:var(--gold); animation:glow 1.6s ease-in-out infinite alternate; }
  .map .done span { border-color:#57c48a; }
  .map .done span::after { content:'✓'; position:absolute; right:-4px; bottom:-4px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
    font:900 13px sans-serif; color:#fff; background:var(--emerald); border:2px solid #d8f5e4; }
  @keyframes glow { from { box-shadow:0 0 0 3px #e3ae4a44, 0 0 8px #e3ae4a88; } to { box-shadow:0 0 0 5px #e3ae4a55, 0 0 22px #ffd36e; } }

  /* pergaminho com moldura */
  .card { position:relative; margin-top:70px; padding:64px 24px 26px; text-align:center; border-radius:12px; animation:in .35s ease;
    background:radial-gradient(ellipse at 50% 40%, #fbf2da 0%, var(--parch) 55%, var(--parch2) 100%);
    border:3px solid var(--gold); box-shadow:0 0 0 7px var(--wood), 0 0 0 9px var(--gold3), inset 0 0 50px #b8863b66, 0 26px 50px #000b; }
  .card::before, .card::after { content:''; position:absolute; top:-12px; width:16px; height:16px; transform:rotate(45deg);
    background:linear-gradient(135deg, var(--gold2), var(--gold3)); border:2px solid var(--wood2); }
  .card::before { left:-12px; } .card::after { right:-12px; }
  @keyframes in { from { opacity:0; transform:translateY(12px); } }
  .crest { position:absolute; top:-58px; left:50%; width:110px; height:110px; margin-left:-55px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 35%, #34418a, #121833); border:4px solid var(--gold); box-shadow:0 0 0 5px var(--wood), 0 10px 24px #000a;
    animation:float 3s ease-in-out infinite; }
  .crest img { width:84px; height:84px; filter:drop-shadow(0 4px 4px #0008); }
  .crest img.face { width:100%; height:100%; border-radius:50%; object-fit:cover; filter:none; }
  .crest.duo { width:190px; margin-left:-95px; background:none; border:0; box-shadow:none; display:flex; justify-content:center; }
  .crest.duo img { width:104px; height:104px; border-radius:50%; object-fit:cover; border:4px solid var(--gold); box-shadow:0 0 0 4px var(--wood), 0 10px 20px #000a; filter:none; }
  .crest.duo img + img { margin-left:-22px; }
  .crest.think { animation:float 3s ease-in-out infinite, glow .7s ease-in-out infinite alternate; }
  @keyframes float { 50% { transform:translateY(-6px); } }

  .kicker { display:flex; align-items:center; justify-content:center; gap:10px; font:800 13px/1.3 'Alegreya Sans', sans-serif; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ruby); margin:0 0 10px; }
  .kicker::before, .kicker::after { content:''; width:26px; height:2px; background:linear-gradient(90deg, transparent, currentColor); }
  .kicker::after { transform:scaleX(-1); }
  h1, h2 { margin:0 0 14px; color:var(--ink); line-height:1.2; }
  h1, .title { font-family:'Cinzel Decorative', Georgia, serif; font-weight:700; letter-spacing:.01em; text-shadow:0 1px 0 #fff9; }
  h1 { font-size:clamp(21px, 7vw, 31px); overflow-wrap:break-word; }
  h2 { font:800 clamp(21px, 6.2vw, 25px)/1.25 Alegreya, Georgia, serif; overflow-wrap:break-word; }
  h2.title { font-size:clamp(20px, 6vw, 25px); }
  p { color:var(--ink2); margin:0 0 18px; }
  p small { font-size:15px; }
  .big { font:800 28px/1.2 Alegreya, Georgia, serif; color:var(--ruby2); margin:4px 0 4px; }
  .sub { font-size:16px; color:var(--ink2); margin-bottom:20px; }

  /* botões */
  button, .btn { font:800 18px 'Alegreya Sans', sans-serif; cursor:pointer; text-decoration:none; display:inline-block; color:var(--ink); transition:transform .1s, box-shadow .1s, filter .15s; }
  .answers { display:grid; gap:9px; margin-bottom:6px; }
  .answers button { display:flex; align-items:center; gap:12px; text-align:left; padding:12px 16px; border-radius:10px;
    background:linear-gradient(180deg, #fffaf0, #f1dfb4); border:2px solid #b48a4a; box-shadow:0 3px 0 #8b6532, inset 0 1px 0 #fff; }
  .answers button::before { content:''; flex:none; width:13px; height:13px; transform:rotate(45deg); border:2px solid #0004; background:var(--g, var(--gold));
    box-shadow:inset 0 0 0 2px #ffffff55; }
  .answers button:hover { filter:brightness(1.04); border-color:var(--gold); transform:translateY(-1px); }
  .answers button:active { transform:translateY(2px); box-shadow:0 1px 0 #8b6532; }
  .g0 { --g:#2f8f5b; } .g1 { --g:#86c35c; } .g2 { --g:#a7a29a; } .g3 { --g:#e08a3a; } .g4 { --g:#b8323f; }
  .answers.row { grid-template-columns:1fr 1fr; }
  .answers.row button { justify-content:center; }
  .answers.row button::before { display:none; }
  .answers.horas { grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); }
  .answers.horas button { justify-content:center; padding:12px 6px; }
  .answers.horas button::before { display:none; }
  .answers.horas .ghost { grid-column:1 / -1; }
  .pick small { display:block; font-weight:500; font-size:15px; color:var(--ink2); }
  .primary, .answers .primary { color:#fff4da; text-shadow:0 1px 0 #0007; padding:14px 28px; border-radius:12px; border:2px solid var(--gold);
    background:linear-gradient(180deg, #cf5262, var(--ruby2)); box-shadow:0 4px 0 #4e111b, 0 10px 20px #0004, inset 0 1px 0 #ffffff55; }
  .primary:hover { filter:brightness(1.08); }
  .primary:active { transform:translateY(3px); box-shadow:0 1px 0 #4e111b; }
  .ghost, .answers .ghost { min-height:44px; background:none; border:0; box-shadow:none; color:var(--ink2); font-weight:700; font-size:16px; padding:10px; text-decoration:underline; text-underline-offset:3px; }
  .answers .ghost { justify-content:center; }
  .answers .ghost::before { display:none; }
  button:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:3px solid #2c5bd8; outline-offset:3px; }

  .xp { display:inline-block; font:800 15px 'Alegreya Sans', sans-serif; color:#3e2405; background:linear-gradient(180deg, #ffe79a, var(--gold));
    border:2px solid var(--gold3); border-radius:999px; padding:5px 14px; margin:0 4px 14px; box-shadow:0 3px 8px #0003; animation:pop .45s ease; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } 70% { transform:scale(1.12); } }

  /* conquista */
  .reward { position:relative; width:170px; height:150px; margin:0 auto 6px; display:grid; place-items:center; }
  .reward::before { content:''; position:absolute; inset:-10px 0; border-radius:50%; animation:spin 12s linear infinite;
    background:repeating-conic-gradient(#f3c75a66 0 10deg, transparent 10deg 24deg); mask:radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask:radial-gradient(circle, #000 30%, transparent 70%); }
  .reward img { position:relative; width:120px; height:120px; filter:drop-shadow(0 6px 8px #0006); animation:pop .6s ease; }
  @keyframes spin { to { transform:rotate(360deg); } }

  textarea { width:100%; font:500 17px 'Alegreya Sans', sans-serif; border:2px solid #b48a4a; border-radius:10px; padding:12px; min-height:80px; resize:vertical;
    background:#fffaf0; color:var(--ink); margin-bottom:12px; }

  /* inventário */
  .inv { list-style:none; padding:0; margin:4px 0 18px; display:grid; gap:10px; text-align:left; }
  .inv li { display:grid; grid-template-columns:60px 1fr; gap:12px; align-items:center; padding:8px 12px 8px 8px; border-radius:12px;
    background:#fffaf0b3; border:2px solid #c9a462; }
  .slot { width:60px; height:60px; border-radius:10px; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #2c366e, #121833);
    border:2px solid var(--gold); box-shadow:inset 0 0 10px #000a; }
  .slot img { width:48px; height:48px; }
  .slot img[src*='/'] { width:100%; height:100%; border-radius:8px; object-fit:cover; }
  .inv b { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ruby); }
  .inv .v { font:800 19px/1.25 Alegreya, Georgia, serif; color:var(--ink); }
  .inv i { display:block; font-style:normal; font-size:15px; color:var(--ink2); }
  .actions { display:grid; gap:10px; }
  .wa { color:#fff; padding:14px 20px; border-radius:12px; border:2px solid var(--gold); background:linear-gradient(180deg, #34c46e, #1c8a49);
    box-shadow:0 4px 0 #0f5a2e, inset 0 1px 0 #ffffff55; text-shadow:0 1px 0 #0006; }
  .actions #copy { padding:12px; border-radius:12px; border:2px solid #b48a4a; background:linear-gradient(180deg, #fffaf0, #f1dfb4); box-shadow:0 3px 0 #8b6532; }
  .note { font-size:15px; margin-top:14px; }

  /* opções com foto: abertura da missão, lista de escolha, palpite e pista */
  .opcoes { display:grid; grid-template-columns:repeat(auto-fill, minmax(138px, 1fr)); gap:10px; margin:0 0 6px; text-align:left; }
  .opcao { display:flex; flex-direction:column; padding:0; overflow:hidden; border-radius:10px; background:#fffaf0; border:2px solid #b48a4a;
    box-shadow:0 3px 0 #8b6532; }
  .opcao:hover { border-color:var(--gold); transform:translateY(-1px); }
  .opcao:active { transform:translateY(2px); box-shadow:0 1px 0 #8b6532; }
  .opcao img { display:block; width:100%; aspect-ratio:4 / 3; object-fit:cover; background:#e8cf98; }
  .opcao.poster img { aspect-ratio:2 / 3; }
  .opcao b { display:block; padding:8px 9px 2px; font:800 16px/1.2 Alegreya, Georgia, serif; overflow-wrap:break-word; }
  .opcao small { display:block; padding:0 9px 9px; font-size:13px; font-weight:500; line-height:1.3; color:var(--ink2); }
  .opcao small.sin { margin-top:-4px; font-style:italic; }
  .ou { font-size:15px; margin:18px 0 10px; }
  .foto { display:block; width:min(100%, 280px); aspect-ratio:4 / 3; object-fit:cover; margin:0 auto 12px; border-radius:10px;
    border:3px solid var(--gold); box-shadow:0 0 0 3px var(--wood), 0 8px 18px #0005; }
  .foto.poster { width:170px; aspect-ratio:2 / 3; }
  .pista { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:12px 0 2px; font-size:14px; color:var(--ink2); }
  .pista img { width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); box-shadow:0 2px 5px #0004; }
  .pista img + img { margin-left:-14px; }

  @media (max-width:420px) {
    body { font-size:17px; }
    .map span { width:48px; height:48px; } .map img { width:36px; height:36px; } .map::before { top:23px; } .map li { width:56px; } .map small { font-size:11px; }
    .card { padding:60px 16px 22px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition:none !important; } }

  /* som, brilho da barra, virada de página, confete */
  .mudo { margin:-8px -8px -8px 2px; min-width:40px; min-height:40px; border:0; background:none; font-size:18px; cursor:pointer; color:var(--parch); }
  .hud.ganhou .bar i { animation:brilho .9s ease-out; }
  @keyframes brilho { 0% { filter:brightness(1.9); box-shadow:0 0 24px #ffd36e, 0 0 6px #fff; } }
  .card { animation:virar .5s cubic-bezier(.2,.8,.3,1); transform-origin:left center; }
  @keyframes virar { from { opacity:0; transform:perspective(1000px) rotateY(18deg); } }
  .confete { position:fixed; inset:0; pointer-events:none; z-index:10; }

  /* carta final */
  .carta { position:relative; text-align:left; padding:18px 16px 30px; margin:0 0 26px; border:2px solid #c9a462; border-radius:6px;
    background:repeating-linear-gradient(0deg, transparent 0 31px, #b8863b1c 31px 32px), #fffaf0cc; box-shadow:inset 0 0 30px #b8863b44; }
  .carta h2 { text-align:center; }
  .carta .abre, .carta .assina { font:italic 500 18px/1.45 Alegreya, Georgia, serif; color:var(--ink); }
  .carta .assina { text-align:right; margin:4px 60px 6px 0; }
  .carta .conq { font-size:14px; margin:0 60px 0 0; }
  .carta .inv { margin-bottom:14px; }
  .selo { position:absolute; right:10px; bottom:-22px; width:62px; height:62px; border-radius:50%; display:grid; place-items:center; transform:rotate(-12deg);
    font-size:26px; color:#ffd9dd; text-shadow:0 1px 0 #0006; background:radial-gradient(circle at 35% 30%, #d9586a, #7d1f2c 72%);
    box-shadow:0 4px 10px #0007, inset 0 -3px 6px #0005, 0 0 0 4px #9a2a3a55; }

  /* desktop: retrato, nível e mapa numa coluna ao lado do pergaminho */
  @media (min-width:980px) {
    main { max-width:960px; display:grid; grid-template-columns:300px 1fr; gap:36px; align-items:start; }
    #hud { position:sticky; top:24px; }
    .map { flex-direction:column; gap:10px; margin:16px 0 0; padding:14px; background:#0b0f24b3; border:2px solid var(--gold3); border-radius:16px; }
    .map::before { left:41px; right:auto; top:34px; bottom:34px; border-top:0; border-left:3px dashed #e3ae4a99; }
    .map li { flex-direction:row; width:auto; gap:14px; }
    .map small { font-size:17px; }
  }
  /* ---- vila ---- */
  .mundo { margin-top:14px; }
  .vila { position:relative; container-type:size; aspect-ratio:768 / 1376; margin:0 auto; overflow:hidden; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    height:min(calc(100dvh - 215px), calc((100vw - 46px) * 1.7917)); border-radius:14px;
    background:#3c5a2a url(img/vila.webp) center / 100% 100% no-repeat; border:3px solid var(--gold); box-shadow:0 0 0 6px var(--wood), 0 18px 40px #000b; }
  .npc, .portao { position:absolute; translate:-50% -100%; background:none; border:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent; }
  .npc img { height:10.5cqh; width:auto; pointer-events:none; filter:drop-shadow(0 3px 2px #0007); }
  .npc small { margin-top:-1px; font:800 clamp(10px, 1.6cqh, 13px)/1.2 'Alegreya Sans', sans-serif; color:#fff4da; white-space:nowrap;
    background:#2a180bd9; border:1px solid var(--gold3); border-radius:999px; padding:1px 7px; }
  .npc.depois img { filter:grayscale(.4) brightness(.85) drop-shadow(0 3px 2px #0007); }
  .balao { position:absolute; top:-3.6cqh; left:50%; translate:-50% 0; width:max(22px, 3.4cqh); height:max(22px, 3.4cqh); border-radius:50%;
    display:none; place-items:center; font:900 max(14px, 2.1cqh)/1 'Alegreya Sans', sans-serif; }
  .npc.agora .balao, .portao.aberto .balao { display:grid; color:#3e2405; background:linear-gradient(#ffe79a, var(--gold)); border:2px solid var(--gold3); animation:pular 1s ease-in-out infinite; }
  .npc.agora .balao::after, .portao.aberto .balao::after { content:'!'; }
  .npc.feito .balao { display:grid; color:#fff; background:var(--emerald); border:2px solid #d8f5e4; }
  .npc.feito .balao::after { content:'✓'; }
  @keyframes pular { 50% { transform:translateY(-6px); } }
  .portao { width:max(44px, 15%); height:max(44px, 8.5%); border-radius:46% 46% 6px 6px; }
  .portao .balao { top:-30%; }
  .portao.aberto { animation:portal 1.6s ease-in-out infinite alternate; }
  @keyframes portal { from { box-shadow:0 0 10px 2px #ffd36e88; } to { box-shadow:0 0 30px 10px #ffd36e; } }
  .npc:focus-visible, .portao:focus-visible { outline:3px solid #2c5bd8; outline-offset:2px; border-radius:10px; }
  .heroi { position:absolute; height:11.5cqh; translate:-50% -100%; pointer-events:none; filter:drop-shadow(0 3px 2px #0007);
    transition-property:left, top; transition-timing-function:linear; }
  .heroi.esquerda { scale:-1 1; }
  .heroi.andando { animation:passo .34s ease-in-out infinite; }
  @keyframes passo { 50% { transform:translateY(-5%) rotate(2deg); } }
  .aviso { position:absolute; left:50%; bottom:2.5%; translate:-50% 0; z-index:2000; width:max-content; max-width:90%; margin:0; pointer-events:none;
    font:700 15px/1.35 'Alegreya Sans', sans-serif; color:var(--ink); text-align:center; background:var(--parch);
    border:2px solid var(--gold); border-radius:12px; box-shadow:0 0 0 3px var(--wood), 0 8px 18px #0008; padding:8px 14px; animation:in .25s ease; }
  .aviso[hidden] { display:none; }

  /* ---- diálogo por cima da vila ---- */
  .dialogo { position:fixed; inset:0; z-index:5000; overflow-y:auto; overscroll-behavior:contain; background:#0b0f24b8; padding:78px 18px 28px; }
  .dialogo[hidden] { display:none; }
  .dialogo .card { max-width:540px; margin:0 auto; }
  .fechar { position:absolute; top:6px; right:6px; width:44px; height:44px; border:0; border-radius:50%; background:none; color:var(--ink2); font:900 20px sans-serif; cursor:pointer; }
  .crest img.npc-rosto { width:102px; height:102px; object-fit:cover; object-position:50% 4%; background:radial-gradient(circle at 50% 35%, #34418a, #121833); }
  .fala { font:italic 500 19px/1.45 Alegreya, Georgia, serif; color:var(--ink); }
  .dica-jogo { font-size:15px; background:#fff8e6; border:1px dashed #c9a462; border-radius:10px; padding:8px 12px; }

  @media (min-width:980px) {
    .mundo { margin-top:0; }
    .vila { height:min(calc(100dvh - 76px), 900px); }
  }
  @media (prefers-reduced-motion:reduce) { .heroi { transition:none !important; } }

  /* ---- roteiro ---- */
  .bilhete { font:italic 600 18px/1.5 Alegreya, Georgia, serif; color:var(--ink); background:#fffaf0; border:2px dashed #c9a462; border-radius:10px; padding:12px 14px; }
  .pedaco { font:italic 700 21px/1.45 Alegreya, Georgia, serif; color:var(--ruby2); margin:6px 6px 14px; }
  .answers button.certo { --g:#2f8f5b; border-color:#2f8f5b; background:linear-gradient(180deg, #eafff1, #c9efd6); }
  .answers button.errado { --g:#b8323f; opacity:.6; animation:tremer .35s; }
  @keyframes tremer { 25% { translate:-5px 0; } 75% { translate:5px 0; } }

  /* relógio */
  .relogio { display:block; width:min(240px, 72%); margin:4px auto 16px; cursor:pointer; filter:drop-shadow(0 6px 10px #0004); }

  /* bolo: ingredientes que aparecem */
  .bolo-barra { margin:0 auto 14px; max-width:320px; }
  .buracos { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:330px; margin:0 auto 10px; }
  .buraco { aspect-ratio:1; border-radius:50%; border:3px solid #9a6a1f; font-size:clamp(30px, 11vw, 46px); line-height:1; display:grid; place-items:center; cursor:pointer;
    background:radial-gradient(circle at 50% 60%, #3a2414 0%, #5a3820 55%, #8b6532 100%); box-shadow:inset 0 6px 12px #0009; }
  .buraco:not(:empty) { animation:pop .25s ease; }
  .buraco.pegou { background:radial-gradient(circle, #ffe79a, var(--gold)); }
  .buraco.errado { animation:tremer .35s; background:radial-gradient(circle, #f3a0a8, #a8323f); }

  /* memória */
  .memoria { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; max-width:380px; margin:0 auto 8px; }
  .carta-mem { aspect-ratio:3 / 4; border-radius:10px; border:2px solid var(--gold3); cursor:pointer; padding:6px; display:grid; place-items:center;
    background:repeating-linear-gradient(45deg, #4a2c17 0 8px, #5a3820 8px 16px); box-shadow:0 3px 0 #2a180b; }
  .carta-mem img { width:100%; opacity:0; transition:opacity .2s; }
  .carta-mem.virada { background:radial-gradient(circle at 50% 35%, #2c366e, #121833); animation:virar-carta .25s ease; }
  @keyframes virar-carta { 50% { transform:scaleX(.1); } }
  .carta-mem.virada img { opacity:1; }
  .carta-mem.par { border-color:#57c48a; box-shadow:0 0 0 3px #57c48a55, 0 3px 0 #2a180b; }

  /* sequência de gemas */
  .gemas { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; max-width:260px; margin:6px auto 10px; }
  .gema { aspect-ratio:1; border-radius:22%; transform:rotate(45deg) scale(.78); border:4px solid #0003; cursor:pointer; box-shadow:inset 0 0 0 5px #ffffff40, 0 6px 12px #0005; filter:brightness(.75) saturate(.85); transition:filter .12s, transform .12s; }
  .gema.rubi { background:linear-gradient(135deg, #ff8a96, #a8323f); } .gema.esmeralda { background:linear-gradient(135deg, #8ff0b4, #2f8f5b); }
  .gema.safira { background:linear-gradient(135deg, #9fb8ff, #3c63b8); } .gema.topazio { background:linear-gradient(135deg, #fff0a8, #d99a26); }
  .gema.acesa { filter:brightness(1.35) saturate(1.2); transform:rotate(45deg) scale(.9); box-shadow:inset 0 0 0 5px #fff9, 0 0 26px #fff; }

  /* final: o castelo e o prêmio */
  .final { position:fixed; inset:0; z-index:6000; overflow-y:auto; background:radial-gradient(circle at 50% 20%, #34418a, var(--night) 70%); padding:16px 16px 40px; }
  .final[hidden] { display:none; }
  .final-cena { position:relative; max-width:540px; margin:0 auto; border-radius:14px; overflow:hidden; border:3px solid var(--gold); box-shadow:0 0 0 6px var(--wood), 0 20px 40px #000b; }
  .final-cena img { display:block; width:100%; height:auto; }
  .final-titulo { position:absolute; left:0; right:0; bottom:0; padding:60px 16px 18px; text-align:center; background:linear-gradient(transparent, #0b0f24ee); }
  .final-titulo .kicker { color:var(--gold2); }
  .final-titulo h1 { color:#ffe3a1; text-shadow:0 2px 8px #000; margin:0; }
  .final-carta { max-width:540px; margin:26px auto 0; padding:26px 20px 24px; }
  .premio { font:800 20px/1.35 Alegreya, Georgia, serif; color:var(--ruby2); margin:28px 0 10px; }
  .vales { list-style:none; padding:0; margin:0 0 20px; display:grid; gap:8px; text-align:left; }
  .vales li { font-weight:700; padding:10px 14px; border:2px dashed var(--gold3); border-radius:10px; background:#fff8e6; }
</style>
</head>
<body>
<video class="bg" id="bg" src="img/cenario.mp4" poster="img/cenario.webp" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
<main>
  <div id="hud" aria-label="Progresso"></div>
  <div class="mundo"><div class="vila" id="vila" aria-label="Vila: toque no chão para andar"><p class="aviso" id="aviso" role="status" hidden></p></div></div>
  <div class="dialogo" id="dialogo" hidden><div id="app" aria-live="polite"></div></div>
</main>
<div class="final" id="final" hidden aria-live="polite"></div>
<script>
// ================= ROTEIRO (edite à vontade: textos, charadas, carta e vales) =================
const ELA = 'Vitória', ELE = 'Lucas';
const PROLOGO = {
  kicker: 'Manhã do seu aniversário',
  titulo: 'A Aventura da Aniversariante',
  texto: `<p>Feliz aniversário, ${ELA}! Mas... cadê o seu escudeiro?</p>
    <p>Ao lado da cama, um bilhete selado:</p>
    <p class="bilhete">“Minha aventureira, sumi de propósito. Cada morador da vila guarda um pedaço da minha carta. Junte os cinco e suba até o castelo: o seu presente está te esperando lá.<br>— L.”</p>`,
  botao: 'Partir em busca do escudeiro',
};
// a carta que ela monta, um pedaço por morador (a ordem é a ordem dos capítulos)
const CARTA = [
  `${ELA}, minha aventureira preferida,`,
  'cada dia ao seu lado é uma aventura que eu escolheria de novo, mil vezes.',
  'Agradeço a Deus por mais um ano da sua vida e por me deixar caminhar com você.',
  'Você é a minha alegria, a minha parceira e o meu lar.',
  `Feliz aniversário! Agora suba até o castelo: o seu prêmio está te esperando.<br>Com todo o amor, seu escudeiro, ${ELE}.`,
];
const CAPITULOS = [
  { npc: 0, icone: 'filme', jogo: 'charadas', titulo: 'As Charadas do Bilheteiro',
    fala: `Ora, ora, a aniversariante! O ${ELE} passou por aqui e deixou um pedaço da carta comigo. Mas só entrego para quem acertar as minhas três charadas!` },
  { npc: 1, icone: 'dia', jogo: 'relogio', titulo: 'A Hora Certa',
    fala: `Tic-tac! O ${ELE} me pediu para guardar isto até a hora certa: a hora da festa! Pare o ponteiro na faixa dourada três vezes.` },
  { npc: 2, icone: 'comida', jogo: 'bolo', titulo: 'O Bolo de Aniversário',
    fala: 'Estou fazendo o seu bolo, mas os ingredientes fugiram! Pegue 10 ingredientes de bolo e deixe a cebola, a pimenta e o alho de fora.' },
  { npc: 3, icone: 'presente', jogo: 'memoria', titulo: 'Os Tesouros Embaralhados',
    fala: 'Psiu! Embaralhei os meus tesouros. Ache todos os pares e o pedaço da carta é seu.' },
  { npc: 4, icone: 'festa', jogo: 'sequencia', titulo: 'A Fanfarra do Castelo',
    fala: 'Tu-tu-ruuu! Para abrir o portão do castelo, repita a sequência das gemas: observe e depois toque na mesma ordem.' },
];
const CHARADAS = [
  { p: 'O que é, o que é: quanto mais se tira, maior fica?', o: ['O buraco', 'A sombra', 'A fila do cinema'], c: 0 },
  { p: 'Tem coroa mas não é rei, tem escamas mas não é peixe. O que é?', o: ['O abacaxi', 'A sereia', 'O pavão'], c: 0 },
  { p: 'O que é que sobe quando a chuva desce?', o: ['O arco-íris', 'O guarda-chuva', 'A pipoca'], c: 1 },
];
const FINAL = {
  kicker: 'Você me encontrou!',
  titulo: `Feliz aniversário, ${ELA}!`,
  premio: 'O prêmio desta aventura... sou eu! E com ele vêm estes vales:',
  vales: ['Um dia inteirinho só nosso', 'Um jantar a dois do jeito que você quiser', 'Abraços ilimitados, sem prazo de validade'],
};
// ===============================================================================================

const app = document.getElementById('app'), hudEl = document.getElementById('hud');
const dialogo = document.getElementById('dialogo'), vilaEl = document.getElementById('vila'), avisoEl = document.getElementById('aviso');
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let cap = -1, xp = 0;  // cap = capítulo atual (0..4); 5 = carta completa, castelo aberto
const lvl = () => 1 + Math.floor(xp / 100);

// ---- progresso salvo neste navegador ----
const CHAVE = 'aventura-v1';
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify({ cap, xp })); } catch {} };
const carregar = () => { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch { return null; } };

// ---- fanfarra e confete ----
let mudo = (() => { try { return localStorage.getItem('aventura-mudo') === '1'; } catch { return false; } })();
const FANFARRA = new Audio('sons/fanfarra.mp3'); FANFARRA.preload = 'auto'; FANFARRA.volume = .6;
function fanfarra() { if (mudo) return; FANFARRA.currentTime = 0; FANFARRA.play().catch(() => {}); }
function confete() {
  if (reduz) return;
  const c = document.createElement('canvas'); c.className = 'confete'; c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const g = c.getContext('2d'), cores = ['#e3ae4a', '#ffe3a1', '#a8323f', '#2f8f5b', '#3c63b8', '#f0a3b8'];
  const p = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3,
    vy: 2 + Math.random() * 3, r: Math.random() * 6, s: 5 + Math.random() * 6, cor: cores[Math.random() * cores.length | 0] }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    p.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += .1; g.save(); g.translate(q.x, q.y); g.rotate(q.r); g.fillStyle = q.cor; g.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); g.restore(); });
    if (++f < 200) requestAnimationFrame(tick); else c.remove();
  })();
}

// ---- HUD: retrato, nível e a carta (pedaços encontrados) ----
function hud(brilho) {
  hudEl.innerHTML = `<div class="hud${brilho ? ' ganhou' : ''}"><div class="portrait"><img src="img/aventureira.webp" alt="Retrato de ${ELA}, a aventureira"></div><div class="who">
      <div class="row"><b>${ELA}</b><span class="lv">Nível ${lvl()}</span><span class="xpn">${xp} XP</span>
        <button class="mudo" aria-label="${mudo ? 'Ligar os sons' : 'Desligar os sons'}" aria-pressed="${mudo}">${mudo ? '🔇' : '🔊'}</button></div>
      <div class="bar" role="progressbar" aria-label="Experiência até o próximo nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${xp % 100}"><i style="width:${xp % 100}%"></i></div></div></div>
    <ol class="map" aria-label="Pedaços da carta">${CAPITULOS.map((c, i) => `<li class="${i < cap ? 'done' : i === cap ? 'on' : 'locked'}"><span><img src="img/${c.icone}.webp" alt=""></span><small>${i < cap ? `Pedaço ${i + 1}` : '?'}</small></li>`).join('')}</ol>`;
  hudEl.querySelector('.mudo').onclick = () => { mudo = !mudo; try { localStorage.setItem('aventura-mudo', mudo ? '1' : '0'); } catch {} hud(); };
}

// ---- a vila ----
const NPCS = [
  { nome: 'Bilheteiro', img: 'npc-bilheteiro', x: 39, y: 80.5 },
  { nome: 'Relojoeira', img: 'npc-relojoeira', x: 61, y: 76.5 },
  { nome: 'Cozinheira', img: 'npc-cozinheira', x: 43, y: 47.5 },
  { nome: 'Mercador', img: 'npc-mercador', x: 65, y: 44.5 },
  { nome: 'Arauto', img: 'npc-arauto', x: 39, y: 20.5 },
];
const PORTAO = { x: 50.5, y: 17 }, INICIO = { x: 50, y: 89.5 };
const pos = { ...INICIO };
function montarVila() {
  vilaEl.insertAdjacentHTML('beforeend', NPCS.map((n, i) => `<button class="npc" data-i="${i}" style="left:${n.x}%;top:${n.y}%;z-index:${Math.round(n.y * 10)}">
      <span class="balao" aria-hidden="true"></span><img src="img/${n.img}.webp" alt=""><small>${n.nome}</small></button>`).join('')
    + `<button class="portao" style="left:${PORTAO.x}%;top:${PORTAO.y}%"><span class="balao" aria-hidden="true"></span></button>`
    + `<img class="heroi" id="vitoria" src="img/heroi-vitoria.webp" alt="${ELA}, a aventureira">`);
  vilaEl.querySelectorAll('.npc').forEach(b => b.onclick = e => { e.stopPropagation(); falarCom(+b.dataset.i); });
  vilaEl.querySelector('.portao').onclick = e => { e.stopPropagation(); irAoPortao(); };
  vilaEl.onclick = e => {
    if (!dialogo.hidden) return;
    const r = vilaEl.getBoundingClientRect();
    andar(Math.min(92, Math.max(8, (e.clientX - r.left) / r.width * 100)), Math.min(95, Math.max(22, (e.clientY - r.top) / r.height * 100)));
  };
  colocar(0);
}
function desenharVila() {
  vilaEl.querySelectorAll('.npc').forEach((b, i) => {
    const estado = i < cap ? 'feito' : i === cap ? 'agora' : 'depois';
    b.className = `npc ${estado}`;
    b.setAttribute('aria-label', `${NPCS[i].nome}: ${estado === 'feito' ? 'pedaço da carta entregue' : estado === 'agora' ? 'tem um desafio para você' : 'ainda não é a vez'}`);
  });
  const p = vilaEl.querySelector('.portao'), aberto = cap >= CAPITULOS.length;
  p.classList.toggle('aberto', aberto);
  p.setAttribute('aria-label', aberto ? 'Portão do castelo: aberto, entrar' : 'Portão do castelo: trancado');
}
function colocar(dur) {
  const el = document.getElementById('vitoria');
  el.style.transitionDuration = `${dur}s`; el.style.left = `${pos.x}%`; el.style.top = `${pos.y}%`; el.style.zIndex = Math.round(pos.y * 10) + 1;
}
let chegada = null;
function andar(x, y, depois) {
  clearTimeout(chegada);
  const r = vilaEl.getBoundingClientRect(), el = document.getElementById('vitoria');
  const dur = reduz ? 0 : Math.min(2.2, Math.hypot((x - pos.x) * r.width, (y - pos.y) * r.height) / 100 / 170);
  el.classList.toggle('esquerda', x < pos.x);
  if (dur) el.classList.add('andando');
  pos.x = Math.min(95, Math.max(5, x)); pos.y = Math.min(97, y);
  colocar(dur);
  chegada = setTimeout(() => { el.classList.remove('andando'); depois?.(); }, dur * 1000 + (dur ? 220 : 0));
}
function aviso(txt) {
  avisoEl.textContent = txt; avisoEl.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => { avisoEl.hidden = true; }, 3400);
}
function falarCom(i) {
  const n = NPCS[i];
  andar(n.x + (n.x > 50 ? -9 : 9), n.y + 1.5, () => {
    if (cap < 0) return;
    if (i < cap) return aviso(`${n.nome}: "Já te entreguei o pedaço ${i + 1}! Corre, que o ${ELE} está esperando."`);
    if (i > cap) return aviso(`${n.nome}: "Ainda não! Primeiro fale com ${artigo(NPCS[cap].nome)} ${NPCS[cap].nome}."`);
    abrirCapitulo();
  });
}
const artigo = nome => /a$/.test(nome) ? 'a' : 'o';
function irAoPortao() {
  andar(PORTAO.x + 10, PORTAO.y + 7, () => {
    if (cap < CAPITULOS.length) return aviso(`O portão está trancado. Faltam ${CAPITULOS.length - Math.max(cap, 0)} pedaços da carta.`);
    final();
  });
}

// ---- diálogo ----
let aoFechar = null;
function fechar() { dialogo.hidden = true; pararJogo(); hud(); desenharVila(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dialogo.hidden) (aoFechar || fechar)(); });
const rostoNpc = i => `<div class="crest"><img class="face npc-rosto" src="img/${NPCS[i].img}.webp" alt="${NPCS[i].nome}"></div>`;
const iconeCap = i => `<div class="crest"><img src="img/${CAPITULOS[i].icone}.webp" alt=""></div>`;
function view(html, topo, brilho) {
  pararJogo(); aoFechar = fechar;
  app.innerHTML = `<div class="card" role="dialog" aria-modal="true">${topo}<button class="fechar" aria-label="Voltar para a vila">✕</button>${html}</div>`;
  app.querySelector('.fechar').onclick = () => (aoFechar || fechar)();
  dialogo.hidden = false; hud(brilho); desenharVila(); dialogo.scrollTop = 0;
  app.querySelector('.card button:not(.fechar)')?.focus({ preventScroll: true });
}
const on = (sel, fn) => app.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b.dataset.v, b));

function start() {
  const s = carregar();
  if (s && s.cap >= 0) { cap = s.cap; xp = s.xp || 0; hud(); desenharVila();
    return aviso(cap >= CAPITULOS.length ? 'A carta está completa! Suba até o castelo.' : `Bem-vinda de volta! Fale com ${artigo(NPCS[cap].nome)} ${NPCS[cap].nome}.`); }
  hud(); desenharVila();
  view(`<p class="kicker">${PROLOGO.kicker}</p><h1>${PROLOGO.titulo}</h1>${PROLOGO.texto}
    <p class="dica-jogo">Toque no chão para andar e nos moradores para conversar. Quem tem um desafio pra você mostra um <b>!</b> dourado.</p>
    <button class="primary">${PROLOGO.botao}</button>`, `<div class="crest"><img class="face" src="img/aventureira.webp" alt="${ELA}"></div>`);
  const comecar = () => { cap = 0; xp = 0; salvar(); fechar(); aviso(`Comece pelo ${NPCS[0].nome}, na tenda do cinema!`); };
  on('.primary', comecar); aoFechar = comecar;
}
function abrirCapitulo() {
  const c = CAPITULOS[cap], n = NPCS[c.npc];
  view(`<p class="kicker">Capítulo ${cap + 1} de ${CAPITULOS.length}</p><h2 class="title">${c.titulo}</h2><p class="fala"><b>${n.nome}:</b> “${c.fala}”</p>
    <button class="primary">Aceitar o desafio</button>`, rostoNpc(c.npc));
  on('.primary', () => JOGOS[c.jogo](capituloCompleto));
}
function capituloCompleto() {
  const i = cap, antes = lvl();
  cap++; xp += 100; salvar(); fanfarra(); confete();
  const ultimo = cap >= CAPITULOS.length;
  view(`<p class="kicker">Pedaço ${i + 1} de ${CAPITULOS.length} encontrado!</p><div class="reward"><img src="img/${CAPITULOS[i].icone}.webp" alt=""></div>
    <p class="pedaco">“${CARTA[i]}”</p><div class="xp">+100 XP</div>${lvl() > antes ? `<div class="xp">⬆ Nível ${lvl()}!</div>` : ''}
    <button class="primary">${ultimo ? 'A carta está completa! Ir ao castelo' : 'Voltar à vila'}</button>`, iconeCap(i), true);
  const voltar = () => { fechar(); aviso(ultimo ? 'O portão do castelo se abriu! Suba até lá.' : `Próxima parada: ${NPCS[cap].nome}.`); };
  on('.primary', voltar); aoFechar = voltar;
}

// ================= MINIJOGOS =================
let timers = [], quadro = null;
function pararJogo() { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; cancelAnimationFrame(quadro); }
const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
const topoJogo = () => iconeCap(cap);

const JOGOS = {
  // 1. Charadas: três perguntas de múltipla escolha; errar não tem castigo
  charadas(fim, k = 0) {
    const q = CHARADAS[k];
    view(`<p class="kicker">Charada ${k + 1} de ${CHARADAS.length}</p><h2>${q.p}</h2>
      <div class="answers">${embaralhar(q.o.map((t, j) => [t, j])).map(([t, j]) => `<button data-v="${j}">${t}</button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    on('.answers button', (v, b) => {
      if (+v === q.c) { b.classList.add('certo'); depois(500, () => k + 1 < CHARADAS.length ? JOGOS.charadas(fim, k + 1) : fim()); }
      else { b.classList.add('errado'); b.disabled = true; app.querySelector('#msg').textContent = 'Quase! Tenta outra.'; }
    });
  },
  // 2. Relógio: pare o ponteiro na faixa dourada (perto das 12) três vezes; fica mais rápido a cada acerto
  relogio(fim) {
    let acertos = 0, ang = 0, ult = 0, rodando = true;
    const vel = () => (reduz ? 90 : 150) + acertos * 55;
    view(`<p class="kicker">A hora certa · ${acertos}/3</p><h2>Pare na faixa dourada!</h2>
      <svg class="relogio" viewBox="-110 -110 220 220" role="img" aria-label="Relógio com ponteiro girando">
        <circle r="100" fill="#fffaf0" stroke="#9a6a1f" stroke-width="8"/>
        <path d="M0 0 L${100 * Math.sin(-.42)} ${-100 * Math.cos(-.42)} A100 100 0 0 1 ${100 * Math.sin(.42)} ${-100 * Math.cos(.42)} Z" fill="#f2c45a"/>
        ${Array.from({ length: 12 }, (_, h) => `<line x1="0" y1="-86" x2="0" y2="-96" stroke="#5a432c" stroke-width="4" transform="rotate(${h * 30})"/>`).join('')}
        <g id="ponteiro"><line x1="0" y1="12" x2="0" y2="-80" stroke="#a8323f" stroke-width="7" stroke-linecap="round"/></g>
        <circle r="9" fill="#5a432c"/></svg>
      <button class="primary" id="parar">Parar!</button><p class="note" id="msg" role="status"></p>`, topoJogo());
    const pont = app.querySelector('#ponteiro'), kick = app.querySelector('.kicker'), msg = app.querySelector('#msg');
    const girar = t => { if (rodando) { ang = (ang + (t - (ult || t)) / 1000 * vel()) % 360; pont.setAttribute('transform', `rotate(${ang})`); } ult = t; quadro = requestAnimationFrame(girar); };
    quadro = requestAnimationFrame(girar);
    const parar = () => {
      if (!rodando) return;
      rodando = false;
      const d = Math.min(ang, 360 - ang);
      if (d <= 24) { acertos++; kick.textContent = `A hora certa · ${acertos}/3`; msg.textContent = acertos < 3 ? 'Na hora certinha! De novo, agora mais rápido.' : 'Perfeito!';
        if (acertos >= 3) return depois(700, fim); }
      else msg.textContent = 'Passou da hora! Tenta de novo.';
      depois(800, () => { msg.textContent = ''; rodando = true; ult = 0; });
    };
    app.querySelector('#parar').onclick = parar;
    app.querySelector('.relogio').onclick = parar;
  },
  // 3. Bolo: toque nos ingredientes de bolo que aparecem; cebola, pimenta e alho tiram ponto
  bolo(fim) {
    const BONS = ['🥚', '🍓', '🍫', '🥛', '🧈', '🍯', '🍒'], RUINS = ['🧅', '🌶️', '🧄'], META = 10;
    const NOMES = { '🥚':'ovo', '🍓':'morango', '🍫':'chocolate', '🥛':'leite', '🧈':'manteiga', '🍯':'mel', '🍒':'cereja', '🧅':'cebola', '🌶️':'pimenta', '🧄':'alho' };
    const marcar = (b, it) => { b.dataset.item = it; b.textContent = it; b.setAttribute('aria-label', it ? NOMES[it] : 'Espaço vazio'); };
    let pontos = 0, tempo = 40;
    view(`<p class="kicker">Ingredientes: <span id="pts">0</span>/${META} · <span id="tmp">${tempo}</span>s</p><h2>Pegue os ingredientes do bolo!</h2>
      <div class="bar bolo-barra"><i id="prog" style="width:0%"></i></div>
      <div class="buracos">${Array.from({ length: 9 }, (_, i) => `<button class="buraco" data-v="${i}" aria-label="Espaço vazio"></button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    const casas = [...app.querySelectorAll('.buraco')], msg = app.querySelector('#msg');
    const atualizar = () => { app.querySelector('#pts').textContent = pontos; app.querySelector('#prog').style.width = `${pontos / META * 100}%`; };
    casas.forEach(b => b.onclick = () => {
      const it = b.dataset.item; if (!it) return;
      marcar(b, '');
      if (BONS.includes(it)) { pontos++; b.classList.add('pegou'); depois(250, () => b.classList.remove('pegou')); }
      else { pontos = Math.max(0, pontos - 1); b.classList.add('errado'); msg.textContent = 'Eca! Isso não vai no bolo.'; depois(400, () => b.classList.remove('errado')); }
      atualizar();
      if (pontos >= META) { pararJogo(); msg.textContent = 'Bolo pronto!'; depois(600, fim); }
    });
    const surgir = () => {
      const livres = casas.filter(b => !b.dataset.item); if (!livres.length) return;
      const b = livres[Math.random() * livres.length | 0];
      const it = Math.random() < .72 ? BONS[Math.random() * BONS.length | 0] : RUINS[Math.random() * RUINS.length | 0];
      marcar(b, it);
      depois(reduz ? 1900 : 1250, () => { if (b.dataset.item === it) marcar(b, ''); });
    };
    timers.push(setInterval(surgir, reduz ? 900 : 620));
    timers.push(setInterval(() => {
      tempo--; app.querySelector('#tmp').textContent = tempo;
      if (tempo <= 0) { pararJogo(); msg.innerHTML = 'O tempo acabou! <button class="ghost" id="denovo">Tentar de novo</button>'; app.querySelector('#denovo').onclick = () => JOGOS.bolo(fim); }
    }, 1000));
  },
  // 4. Memória: 6 pares com os ícones da aventura
  memoria(fim) {
    const ICONES = ['filme', 'dia', 'comida', 'presente', 'festa', 'escudo'];
    const cartas = embaralhar([...ICONES, ...ICONES]);
    let abertas = [], pares = 0, jogadas = 0, travado = false;
    view(`<p class="kicker">Pares: <span id="pares">0</span>/${ICONES.length} · jogadas: <span id="jog">0</span></p><h2>Ache os pares!</h2>
      <div class="memoria">${cartas.map((ic, i) => `<button class="carta-mem" data-v="${i}" aria-label="Carta virada"><img src="img/${ic}.webp" alt=""></button>`).join('')}</div>`, topoJogo());
    on('.carta-mem', (v, b) => {
      if (travado || b.classList.contains('virada')) return;
      b.classList.add('virada'); b.setAttribute('aria-label', cartas[v]); abertas.push(b);
      if (abertas.length < 2) return;
      jogadas++; app.querySelector('#jog').textContent = jogadas;
      const [a, c] = abertas; abertas = [];
      if (cartas[a.dataset.v] === cartas[c.dataset.v]) {
        a.classList.add('par'); c.classList.add('par'); pares++; app.querySelector('#pares').textContent = pares;
        if (pares === ICONES.length) depois(600, fim);
      } else { travado = true; depois(800, () => { a.classList.remove('virada'); c.classList.remove('virada'); a.setAttribute('aria-label', 'Carta virada'); c.setAttribute('aria-label', 'Carta virada'); travado = false; }); }
    });
  },
  // 5. Sequência: as gemas acendem numa ordem; ela repete. Três rodadas (3, 4 e 5 gemas)
  sequencia(fim) {
    const GEMAS = [['rubi', 'Rubi'], ['esmeralda', 'Esmeralda'], ['safira', 'Safira'], ['topazio', 'Topázio']];
    let rodada = 0, seq = [], pos = 0, ouvindo = false;
    view(`<p class="kicker">Rodada <span id="rod">1</span> de 3</p><h2 id="tit">Observe as gemas...</h2>
      <div class="gemas">${GEMAS.map(([k, n], i) => `<button class="gema ${k}" data-v="${i}" aria-label="${n}"></button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    const bt = [...app.querySelectorAll('.gema')], tit = app.querySelector('#tit'), msg = app.querySelector('#msg');
    const acender = (i, ms = 420) => { bt[i].classList.add('acesa'); depois(ms, () => bt[i].classList.remove('acesa')); };
    const mostrar = () => {
      ouvindo = false; pos = 0; tit.textContent = 'Observe as gemas...'; app.querySelector('#rod').textContent = rodada + 1;
      seq.forEach((g, k) => depois(700 + k * 650, () => acender(g)));
      depois(700 + seq.length * 650, () => { ouvindo = true; tit.textContent = 'Agora você! Toque na mesma ordem.'; });
    };
    const nova = () => { seq = Array.from({ length: 3 + rodada }, () => Math.random() * 4 | 0); mostrar(); };
    on('.gema', v => {
      if (!ouvindo) return;
      acender(+v, 220);
      if (+v !== seq[pos]) { ouvindo = false; msg.textContent = 'Nota errada! Olha de novo.'; return depois(900, () => { msg.textContent = ''; mostrar(); }); }
      if (++pos === seq.length) {
        ouvindo = false; rodada++;
        if (rodada >= 3) { tit.textContent = 'Fanfarra perfeita!'; return depois(700, fim); }
        msg.textContent = 'Isso! Próxima rodada.'; depois(1000, () => { msg.textContent = ''; nova(); });
      }
    });
    nova();
  },
};

// ================= FINAL: o castelo e o prêmio =================
function final() {
  pararJogo(); dialogo.hidden = true;
  const f = document.getElementById('final');
  f.innerHTML = `<div class="final-cena"><img src="img/final.webp" alt="${ELE}, o escudeiro, esperando no salão do castelo com flores e um bolo de aniversário">
      <div class="final-titulo"><p class="kicker">${FINAL.kicker}</p><h1>${FINAL.titulo}</h1></div></div>
    <div class="card final-carta">
      <div class="carta"><h2 class="title">A carta do escudeiro</h2>${CARTA.map(t => `<p class="abre">${t}</p>`).join('')}<div class="selo" aria-hidden="true">♥</div></div>
      <p class="premio">${FINAL.premio}</p>
      <ul class="vales">${FINAL.vales.map(v => `<li><span aria-hidden="true">🎟️</span> ${v}</li>`).join('')}</ul>
      <div class="actions"><button class="primary" id="vila-de-novo">Voltar à vila</button><button class="ghost" id="recomecar">Jogar a aventura de novo</button></div>
    </div>`;
  f.hidden = false; f.scrollTop = 0; document.body.classList.add('no-final');
  fanfarra(); confete(); depois(2200, confete);
  f.querySelector('#vila-de-novo').onclick = () => { f.hidden = true; document.body.classList.remove('no-final'); };
  f.querySelector('#recomecar').onclick = () => { try { localStorage.removeItem(CHAVE); } catch {} f.hidden = true; document.body.classList.remove('no-final'); cap = -1; xp = 0; Object.assign(pos, INICIO); colocar(0); start(); };
  f.querySelector('#vila-de-novo').focus({ preventScroll: true });
}

const bg = document.getElementById('bg');
if (reduz || navigator.connection?.saveData) { bg.removeAttribute('autoplay'); bg.preload = 'none'; bg.pause(); }
montarVila();
start();
</script>
