<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>A Aventura da Aniversariante</title>
<meta name="description" content="Uma aventura pela vila para encontrar o escudeiro. Feliz aniversário, Vitória!">
<!-- site pessoal: o link funciona e a prévia aparece, mas fica fora das buscas -->

<meta property="og:description" content="O escudeiro sumiu e deixou pistas pela vila. Encontre os 9 pedaços da carta e descubra o seu presente!">
<meta property="og:url" content="https://aniversario.lucasjrdev.com/">

<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="img/escudo.webp" type="image/webp">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --night:#121833; --wood:#4a2c17; --wood2:#2a180b; --gold:#e3ae4a; --gold2:#ffe3a1; --gold3:#9a6a1f;
    --parch:#f6e9c8; --parch2:#e8cf98; --ink:#2b1c10; --ink2:#5a432c; --ruby:#a8323f; --ruby2:#7d1f2c; --emerald:#2f8f5b; }
  * { box-sizing:border-box; }
  html { background:var(--night); overflow-x:clip; }
  body { margin:0; min-height:100vh; min-height:100dvh; font:500 18px/1.5 'Alegreya Sans', system-ui, sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:16px 20px 40px; }
  body::before { content:''; position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, #0b0f24cc 0%, #0b0f2455 35%, #0b0f24aa 100%); }
  .bg { position:fixed; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:62% center; background:var(--night) url(img/cenario.webp) 62% center / cover; }
  main { width:100%; max-width:540px; }

  /* HUD: retrato, nível e XP */
  .hud { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; padding:8px 14px 8px 8px; border-radius:16px;
    background:linear-gradient(180deg, #5a3820, var(--wood2)); border:2px solid var(--gold3); box-shadow:inset 0 1px 0 #ffffff26, 0 8px 20px #0009; color:var(--parch); }
  .portrait { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #33407e, #121833);
    border:3px solid var(--gold); box-shadow:0 0 0 2px var(--wood2); }
  .portrait img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .who .row { display:flex; align-items:baseline; gap:8px; margin-bottom:5px; }
  .who b { font:800 18px Alegreya, Georgia, serif; color:var(--gold2); }
  .lv { font-weight:800; font-size:13px; color:#2a1a06; background:linear-gradient(#ffe79a, var(--gold)); border-radius:999px; padding:1px 9px; }
  .xpn { margin-left:auto; font-weight:800; font-size:14px; color:var(--gold2); }
  .bar { height:14px; border-radius:999px; border:2px solid var(--gold3); background:#00000080; overflow:hidden; box-shadow:inset 0 2px 4px #000a; }
  .bar i { display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.2,.9,.3,1.2);
    background:linear-gradient(180deg, #fff2bf 0%, #f0c45c 45%, #b9802a 100%); box-shadow:0 0 10px #f0c45c; }

  /* mapa das missões */
  .map { list-style:none; display:flex; justify-content:space-between; position:relative; margin:14px 4px 0; padding:0; }
  .map::before { content:''; position:absolute; left:28px; right:28px; top:27px; border-top:3px dashed #e3ae4a99; }
  .map li { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; width:64px; }
  .map span { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; position:relative;
    background:radial-gradient(circle at 50% 35%, #2c366e, #121833); border:3px solid #6b5a3a; box-shadow:0 4px 10px #0008; transition:.3s; }
  .map img { width:42px; height:42px; }
  .map small { font-size:12px; font-weight:800; color:var(--parch); text-shadow:0 1px 3px #000; }
  .map .locked img { filter:grayscale(1) brightness(.55); }
  .map .locked small { opacity:.6; }
  .map .on span { border-color:var(--gold); animation:glow 1.6s ease-in-out infinite alternate; }
  .map .done span { border-color:#57c48a; }
  .map .done span::after { content:'✓'; position:absolute; right:-4px; bottom:-4px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
    font:900 13px sans-serif; color:#fff; background:var(--emerald); border:2px solid #d8f5e4; }
  @keyframes glow { from { box-shadow:0 0 0 3px #e3ae4a44, 0 0 8px #e3ae4a88; } to { box-shadow:0 0 0 5px #e3ae4a55, 0 0 22px #ffd36e; } }

  /* pergaminho com moldura */
  .card { position:relative; margin-top:70px; padding:64px 24px 26px; text-align:center; border-radius:12px; animation:in .35s ease;
    background:radial-gradient(ellipse at 50% 40%, #fbf2da 0%, var(--parch) 55%, var(--parch2) 100%);
    border:3px solid var(--gold); box-shadow:0 0 0 7px var(--wood), 0 0 0 9px var(--gold3), inset 0 0 50px #b8863b66, 0 26px 50px #000b; }
  .card::before, .card::after { content:''; position:absolute; top:-12px; width:16px; height:16px; transform:rotate(45deg);
    background:linear-gradient(135deg, var(--gold2), var(--gold3)); border:2px solid var(--wood2); }
  .card::before { left:-12px; } .card::after { right:-12px; }
  @keyframes in { from { opacity:0; transform:translateY(12px); } }
  .crest { position:absolute; top:-58px; left:50%; width:110px; height:110px; margin-left:-55px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 35%, #34418a, #121833); border:4px solid var(--gold); box-shadow:0 0 0 5px var(--wood), 0 10px 24px #000a;
    animation:float 3s ease-in-out infinite; }
  .crest img { width:84px; height:84px; filter:drop-shadow(0 4px 4px #0008); }
  .crest img.face { width:100%; height:100%; border-radius:50%; object-fit:cover; filter:none; }
  .crest.duo { width:190px; margin-left:-95px; background:none; border:0; box-shadow:none; display:flex; justify-content:center; }
  .crest.duo img { width:104px; height:104px; border-radius:50%; object-fit:cover; border:4px solid var(--gold); box-shadow:0 0 0 4px var(--wood), 0 10px 20px #000a; filter:none; }
  .crest.duo img + img { margin-left:-22px; }
  .crest.think { animation:float 3s ease-in-out infinite, glow .7s ease-in-out infinite alternate; }
  @keyframes float { 50% { transform:translateY(-6px); } }

  .kicker { display:flex; align-items:center; justify-content:center; gap:10px; font:800 13px/1.3 'Alegreya Sans', sans-serif; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ruby); margin:0 0 10px; }
  .kicker::before, .kicker::after { content:''; width:26px; height:2px; background:linear-gradient(90deg, transparent, currentColor); }
  .kicker::after { transform:scaleX(-1); }
  h1, h2 { margin:0 0 14px; color:var(--ink); line-height:1.2; }
  h1, .title { font-family:'Cinzel Decorative', Georgia, serif; font-weight:700; letter-spacing:.01em; text-shadow:0 1px 0 #fff9; }
  h1 { font-size:clamp(21px, 7vw, 31px); overflow-wrap:break-word; }
  h2 { font:800 clamp(21px, 6.2vw, 25px)/1.25 Alegreya, Georgia, serif; overflow-wrap:break-word; }
  h2.title { font-size:clamp(20px, 6vw, 25px); }
  p { color:var(--ink2); margin:0 0 18px; }
  p small { font-size:15px; }
  .big { font:800 28px/1.2 Alegreya, Georgia, serif; color:var(--ruby2); margin:4px 0 4px; }
  .sub { font-size:16px; color:var(--ink2); margin-bottom:20px; }

  /* botões */
  button, .btn { font:800 18px 'Alegreya Sans', sans-serif; cursor:pointer; text-decoration:none; display:inline-block; color:var(--ink); transition:transform .1s, box-shadow .1s, filter .15s; }
  .answers { display:grid; gap:9px; margin-bottom:6px; }
  .answers button { display:flex; align-items:center; gap:12px; text-align:left; padding:12px 16px; border-radius:10px;
    background:linear-gradient(180deg, #fffaf0, #f1dfb4); border:2px solid #b48a4a; box-shadow:0 3px 0 #8b6532, inset 0 1px 0 #fff; }
  .answers button::before { content:''; flex:none; width:13px; height:13px; transform:rotate(45deg); border:2px solid #0004; background:var(--g, var(--gold));
    box-shadow:inset 0 0 0 2px #ffffff55; }
  .answers button:hover { filter:brightness(1.04); border-color:var(--gold); transform:translateY(-1px); }
  .answers button:active { transform:translateY(2px); box-shadow:0 1px 0 #8b6532; }
  .g0 { --g:#2f8f5b; } .g1 { --g:#86c35c; } .g2 { --g:#a7a29a; } .g3 { --g:#e08a3a; } .g4 { --g:#b8323f; }
  .answers.row { grid-template-columns:1fr 1fr; }
  .answers.row button { justify-content:center; }
  .answers.row button::before { display:none; }
  .answers.horas { grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); }
  .answers.horas button { justify-content:center; padding:12px 6px; }
  .answers.horas button::before { display:none; }
  .answers.horas .ghost { grid-column:1 / -1; }
  .pick small { display:block; font-weight:500; font-size:15px; color:var(--ink2); }
  .primary, .answers .primary { color:#fff4da; text-shadow:0 1px 0 #0007; padding:14px 28px; border-radius:12px; border:2px solid var(--gold);
    background:linear-gradient(180deg, #cf5262, var(--ruby2)); box-shadow:0 4px 0 #4e111b, 0 10px 20px #0004, inset 0 1px 0 #ffffff55; }
  .primary:hover { filter:brightness(1.08); }
  .primary:active { transform:translateY(3px); box-shadow:0 1px 0 #4e111b; }
  .ghost, .answers .ghost { min-height:44px; background:none; border:0; box-shadow:none; color:var(--ink2); font-weight:700; font-size:16px; padding:10px; text-decoration:underline; text-underline-offset:3px; }
  .answers .ghost { justify-content:center; }
  .answers .ghost::before { display:none; }
  button:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:3px solid var(--gold3); outline-offset:3px; }

  .xp { display:inline-block; font:800 15px 'Alegreya Sans', sans-serif; color:#3e2405; background:linear-gradient(180deg, #ffe79a, var(--gold));
    border:2px solid var(--gold3); border-radius:999px; padding:5px 14px; margin:0 4px 14px; box-shadow:0 3px 8px #0003; animation:pop .45s ease; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } 70% { transform:scale(1.12); } }

  /* conquista */
  .reward { position:relative; width:170px; height:150px; margin:0 auto 6px; display:grid; place-items:center; }
  .reward::before { content:''; position:absolute; inset:-10px 0; border-radius:50%; animation:spin 12s linear infinite;
    background:repeating-conic-gradient(#f3c75a66 0 10deg, transparent 10deg 24deg); mask:radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask:radial-gradient(circle, #000 30%, transparent 70%); }
  .reward img { position:relative; width:120px; height:120px; filter:drop-shadow(0 6px 8px #0006); animation:pop .6s ease; }
  @keyframes spin { to { transform:rotate(360deg); } }

  textarea { width:100%; font:500 17px 'Alegreya Sans', sans-serif; border:2px solid #b48a4a; border-radius:10px; padding:12px; min-height:80px; resize:vertical;
    background:#fffaf0; color:var(--ink); margin-bottom:12px; }

  /* inventário */
  .inv { list-style:none; padding:0; margin:4px 0 18px; display:grid; gap:10px; text-align:left; }
  .inv li { display:grid; grid-template-columns:60px 1fr; gap:12px; align-items:center; padding:8px 12px 8px 8px; border-radius:12px;
    background:#fffaf0b3; border:2px solid #c9a462; }
  .slot { width:60px; height:60px; border-radius:10px; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, #2c366e, #121833);
    border:2px solid var(--gold); box-shadow:inset 0 0 10px #000a; }
  .slot img { width:48px; height:48px; }
  .slot img[src*='/'] { width:100%; height:100%; border-radius:8px; object-fit:cover; }
  .inv b { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ruby); }
  .inv .v { font:800 19px/1.25 Alegreya, Georgia, serif; color:var(--ink); }
  .inv i { display:block; font-style:normal; font-size:15px; color:var(--ink2); }
  .actions { display:grid; gap:10px; }
  .wa { color:#fff; padding:14px 20px; border-radius:12px; border:2px solid var(--gold); background:linear-gradient(180deg, #34c46e, #1c8a49);
    box-shadow:0 4px 0 #0f5a2e, inset 0 1px 0 #ffffff55; text-shadow:0 1px 0 #0006; }
  .actions #copy { padding:12px; border-radius:12px; border:2px solid #b48a4a; background:linear-gradient(180deg, #fffaf0, #f1dfb4); box-shadow:0 3px 0 #8b6532; }
  .note { font-size:15px; margin-top:14px; }

  /* opções com foto: abertura da missão, lista de escolha, palpite e pista */
  .opcoes { display:grid; grid-template-columns:repeat(auto-fill, minmax(138px, 1fr)); gap:10px; margin:0 0 6px; text-align:left; }
  .opcao { display:flex; flex-direction:column; padding:0; overflow:hidden; border-radius:10px; background:#fffaf0; border:2px solid #b48a4a;
    box-shadow:0 3px 0 #8b6532; }
  .opcao:hover { border-color:var(--gold); transform:translateY(-1px); }
  .opcao:active { transform:translateY(2px); box-shadow:0 1px 0 #8b6532; }
  .opcao img { display:block; width:100%; aspect-ratio:4 / 3; object-fit:cover; background:#e8cf98; }
  .opcao.poster img { aspect-ratio:2 / 3; }
  .opcao b { display:block; padding:8px 9px 2px; font:800 16px/1.2 Alegreya, Georgia, serif; overflow-wrap:break-word; }
  .opcao small { display:block; padding:0 9px 9px; font-size:13px; font-weight:500; line-height:1.3; color:var(--ink2); }
  .opcao small.sin { margin-top:-4px; font-style:italic; }
  .ou { font-size:15px; margin:18px 0 10px; }
  .foto { display:block; width:min(100%, 280px); aspect-ratio:4 / 3; object-fit:cover; margin:0 auto 12px; border-radius:10px;
    border:3px solid var(--gold); box-shadow:0 0 0 3px var(--wood), 0 8px 18px #0005; }
  .foto.poster { width:170px; aspect-ratio:2 / 3; }
  .pista { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:12px 0 2px; font-size:14px; color:var(--ink2); }
  .pista img { width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); box-shadow:0 2px 5px #0004; }
  .pista img + img { margin-left:-14px; }

  @media (max-width:420px) {
    body { font-size:17px; }
    .map span { width:48px; height:48px; } .map img { width:36px; height:36px; } .map::before { top:23px; } .map li { width:56px; } .map small { font-size:11px; }
    .card { padding:60px 16px 22px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition:none !important; } }

  /* som, brilho da barra, virada de página, confete */
  .mudo { margin:-8px -8px -8px 2px; min-width:40px; min-height:40px; border:0; background:none; font-size:18px; cursor:pointer; color:var(--parch); }
  .hud.ganhou .bar i { animation:brilho .9s ease-out; }
  @keyframes brilho { 0% { filter:brightness(1.9); box-shadow:0 0 24px #ffd36e, 0 0 6px #fff; } }
  .card { animation:virar .5s cubic-bezier(.2,.8,.3,1); transform-origin:left center; }
  @keyframes virar { from { opacity:0; transform:perspective(1000px) rotateY(18deg); } }
  .confete { position:fixed; inset:0; pointer-events:none; z-index:10; }

  /* carta final */
  .carta { position:relative; text-align:left; padding:18px 16px 30px; margin:0 0 26px; border:2px solid #c9a462; border-radius:6px;
    background:repeating-linear-gradient(0deg, transparent 0 31px, #b8863b1c 31px 32px), #fffaf0cc; box-shadow:inset 0 0 30px #b8863b44; }
  .carta h2 { text-align:center; }
  .carta .abre, .carta .assina { font:italic 500 18px/1.45 Alegreya, Georgia, serif; color:var(--ink); }
  .carta .assina { text-align:right; margin:4px 60px 6px 0; }
  .carta .conq { font-size:14px; margin:0 60px 0 0; }
  .carta .inv { margin-bottom:14px; }
  .selo { position:absolute; right:10px; bottom:-22px; width:62px; height:62px; border-radius:50%; display:grid; place-items:center; transform:rotate(-12deg);
    font-size:26px; color:#ffd9dd; text-shadow:0 1px 0 #0006; background:radial-gradient(circle at 35% 30%, #d9586a, #7d1f2c 72%);
    box-shadow:0 4px 10px #0007, inset 0 -3px 6px #0005, 0 0 0 4px #9a2a3a55; }

  /* desktop: retrato, nível e mapa numa coluna ao lado do pergaminho */
  @media (min-width:980px) {
    main { max-width:960px; display:grid; grid-template-columns:300px 1fr; gap:36px; align-items:start; }
    #hud { position:sticky; top:24px; }
    .map { flex-direction:column; gap:10px; margin:16px 0 0; padding:14px; background:#0b0f24b3; border:2px solid var(--gold3); border-radius:16px; }
    .map::before { left:41px; right:auto; top:34px; bottom:34px; border-top:0; border-left:3px dashed #e3ae4a99; }
    .map li { flex-direction:row; width:auto; gap:14px; }
    .map small { font-size:17px; }
  }
  /* ---- vila ---- */
  .mundo { margin-top:14px; }
  .vila { position:relative; container-type:size; aspect-ratio:768 / 1376; margin:0 auto; overflow:hidden; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    height:min(calc(100dvh - 215px), calc((100vw - 46px) * 1.7917)); border-radius:14px;
    background:#3c5a2a url(img/vila.webp) center / 100% 100% no-repeat; border:3px solid var(--gold); box-shadow:0 0 0 6px var(--wood), 0 18px 40px #000b; }
  .npc, .portao { position:absolute; translate:-50% -100%; background:none; border:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent; }
  .npc img { height:10.5cqh; width:auto; pointer-events:none; filter:drop-shadow(0 3px 2px #0007); }
  .npc small { margin-top:-1px; font:800 clamp(10px, 1.6cqh, 13px)/1.2 'Alegreya Sans', sans-serif; color:#fff4da; white-space:nowrap;
    background:#2a180bd9; border:1px solid var(--gold3); border-radius:999px; padding:1px 7px; }
  .npc.depois img { filter:grayscale(.4) brightness(.85) drop-shadow(0 3px 2px #0007); }
  .balao { position:absolute; top:-3.6cqh; left:50%; translate:-50% 0; width:max(22px, 3.4cqh); height:max(22px, 3.4cqh); border-radius:50%;
    display:none; place-items:center; font:900 max(14px, 2.1cqh)/1 'Alegreya Sans', sans-serif; }
  .npc.agora .balao, .portao.aberto .balao { display:grid; color:#3e2405; background:linear-gradient(#ffe79a, var(--gold)); border:2px solid var(--gold3); animation:pular 1s ease-in-out infinite; }
  .npc.agora .balao::after, .portao.aberto .balao::after { content:'!'; }
  .npc.feito .balao { display:grid; color:#fff; background:var(--emerald); border:2px solid #d8f5e4; }
  .npc.feito .balao::after { content:'✓'; }
  @keyframes pular { 50% { transform:translateY(-6px); } }
  .portao { width:max(44px, 15%); height:max(44px, 8.5%); border-radius:46% 46% 6px 6px; }
  .portao .balao { top:-30%; }
  .portao.aberto { animation:portal 1.6s ease-in-out infinite alternate; }
  @keyframes portal { from { box-shadow:0 0 10px 2px #ffd36e88; } to { box-shadow:0 0 30px 10px #ffd36e; } }
  .npc:focus-visible, .portao:focus-visible { outline:3px solid var(--gold); outline-offset:2px; border-radius:10px; }
  .heroi { position:absolute; height:11.5cqh; translate:-50% -100%; pointer-events:none; filter:drop-shadow(0 3px 2px #0007);
    transition-property:left, top; transition-timing-function:linear; }
  .heroi.esquerda { scale:-1 1; }
  .heroi.andando { animation:passo .34s ease-in-out infinite; }
  @keyframes passo { 50% { transform:translateY(-5%) rotate(2deg); } }
  .aviso { position:absolute; left:50%; bottom:2.5%; translate:-50% 0; z-index:2000; width:max-content; max-width:90%; margin:0; pointer-events:none;
    font:700 15px/1.35 'Alegreya Sans', sans-serif; color:var(--ink); text-align:center; background:var(--parch);
    border:2px solid var(--gold); border-radius:12px; box-shadow:0 0 0 3px var(--wood), 0 8px 18px #0008; padding:8px 14px; animation:in .25s ease; }
  .aviso[hidden] { display:none; }

  /* ---- diálogo por cima da vila ---- */
  .dialogo { position:fixed; inset:0; z-index:5000; overflow-y:auto; overscroll-behavior:contain; background:#0b0f24b8; padding:78px 18px 28px; }

  /* ---- roteiro ---- */

  /* relógio */

  /* bolo: ingredientes que aparecem */
  .bolo-barra { margin:0 auto 14px; max-width:320px; }
  .buracos { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:330px; margin:0 auto 10px; }

  /* sequência de gemas */
  .gemas { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; max-width:260px; margin:6px auto 10px; }

  /* final: o castelo e o prêmio */

  .heroi .sombra { position:absolute; left:50%; bottom:.2cqh; width:5.4cqh; height:1.5cqh; translate:-50% 0; border-radius:50%; background:radial-gradient(#000a, transparent 70%); }
  .poeira { position:absolute; width:2cqh; height:1.2cqh; translate:-50% -50%; border-radius:50%; background:#e8dcc0; pointer-events:none; animation:poeira .6s ease-out forwards; }
  @keyframes poeira { from { opacity:.7; scale:.5; } to { opacity:0; scale:2.2; translate:-50% -140%; } }
  .marca { position:absolute; width:4cqh; height:1.6cqh; translate:-50% -50%; border:3px solid #ffe79a; border-radius:50%; pointer-events:none; animation:marca .7s ease-out forwards; }
  @keyframes marca { from { scale:.4; opacity:1; } to { scale:1.6; opacity:0; } }

    animation:vagalume 8s ease-in-out infinite; }

  .nuvem { position:absolute; width:70%; height:22%; border-radius:50%; background:radial-gradient(#0b0f2438, transparent 70%); pointer-events:none; z-index:1400; animation:nuvem 46s linear infinite; }
  .nuvem.n1 { top:18%; } .nuvem.n2 { top:58%; animation-delay:-23s; animation-duration:58s; }
  @keyframes nuvem { from { left:-75%; } to { left:105%; } }
  .portao.aberto::before { content:''; position:absolute; inset:-40% -60%; border-radius:50%; background:radial-gradient(#ffe7a0cc, transparent 65%); animation:portal 1.6s ease-in-out infinite alternate; z-index:-1; }

  /* topo: perfil, pedaços da carta e som */
  .topo { position:fixed; z-index:100; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; align-items:flex-start; gap:8px; pointer-events:none; }

  .perfil { display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border-radius:999px; color:var(--parch);

  .pedacos { list-style:none; margin:4px 0 0 auto; padding:5px 7px; display:flex; gap:4px; border-radius:999px; background:#2a180bcc; border:2px solid var(--gold3); box-shadow:0 6px 14px #0008; }
  .pedacos li { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#121833; border:1.5px solid #6b5a3a; }

  /* controles */
  .controles { position:fixed; z-index:90; left:0; right:0; bottom:max(14px, env(safe-area-inset-bottom)); pointer-events:none; }
  .stick { position:absolute; left:18px; bottom:0; width:124px; height:124px; border-radius:50%; pointer-events:auto; touch-action:none;
    background:radial-gradient(circle, #0b0f2455, #0b0f24aa); border:3px solid #e3ae4a99; box-shadow:0 8px 20px #0007; display:grid; place-items:center; }
  .stick i { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #ffe9a8, var(--gold) 60%, #9a6a1f); border:3px solid #5a3820; box-shadow:0 4px 10px #0008; transition:transform .08s; }
  .stick.ativo { border-color:var(--gold); }
  .acao { position:absolute; right:16px; bottom:30px; pointer-events:auto; max-width:calc(100% - 175px); min-height:54px; padding:12px 18px; border-radius:16px;
    font:800 16px/1.2 'Alegreya Sans', sans-serif; color:#3e2405; background:linear-gradient(180deg, #ffe79a, var(--gold)); border:3px solid #9a6a1f; box-shadow:0 5px 0 #6b4a12, 0 10px 20px #0007; animation:pop .25s ease; }
  .acao[hidden] { display:none; }
  .acao:active { transform:translateY(3px); box-shadow:0 2px 0 #6b4a12; }
  @media (hover:hover) and (pointer:fine) { .stick { display:none; } .acao { max-width:none; } .acao::after { content:'  (Enter)'; font-weight:600; opacity:.7; } }
  .aviso { position:fixed; left:50%; bottom:calc(max(14px, env(safe-area-inset-bottom)) + 140px); z-index:95; }

  /* caixa de fala de RPG */
  .fala { position:fixed; z-index:200; left:0; right:0; bottom:0; padding:12px 12px max(14px, env(safe-area-inset-bottom)); background:linear-gradient(transparent, #0b0f24cc 40%); }
  .fala[hidden] { display:none; }
  .fala-caixa { position:relative; max-width:640px; margin:0 auto; display:grid; grid-template-columns:auto 1fr; gap:12px; padding:14px 14px 12px; border-radius:14px; animation:subir .3s ease;
    background:radial-gradient(ellipse at 50% 30%, #fbf2da, var(--parch) 60%, var(--parch2)); border:3px solid var(--gold); box-shadow:0 0 0 6px var(--wood), 0 18px 40px #000b; }
  @keyframes subir { from { transform:translateY(30px); opacity:0; } }
  .fala-rosto { width:76px; height:76px; border-radius:50%; object-fit:cover; object-position:50% 4%; background:radial-gradient(circle at 50% 35%, #34418a, #121833); border:3px solid var(--gold); box-shadow:0 0 0 3px var(--wood); }

  .fala-texto { margin:0 0 10px; min-height:3.2em; font:500 18px/1.45 Alegreya, Georgia, serif; color:var(--ink); }
  .fala-botoes { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }

  .fala-botoes button:not(.primary):not(.ghost) { padding:12px 18px; border-radius:12px; border:2px solid #b48a4a; background:linear-gradient(180deg, #fffaf0, #f1dfb4); }
  .fala-botoes .primary { padding:12px 20px; }

  /* painel dos desafios */
  .painel { position:fixed; inset:0; z-index:300; overflow-y:auto; overscroll-behavior:contain; background:#0b0f24c4; padding:80px 16px 28px; }
  .painel[hidden] { display:none; }
  .painel .card { max-width:540px; margin:0 auto; }

  /* faixa de capítulo, voo do pedaço, clarão e corações */
  .faixa { position:fixed; z-index:400; left:0; right:0; top:40%; text-align:center; padding:18px 12px; pointer-events:none;
    background:linear-gradient(90deg, transparent, #2a180bf2 12%, #4a2c17f2 50%, #2a180bf2 88%, transparent); border-block:3px solid var(--gold);
    animation:faixa 1.5s ease forwards; }
  .faixa small { display:block; font:800 13px 'Alegreya Sans', sans-serif; letter-spacing:.2em; text-transform:uppercase; color:var(--gold2); }
  .faixa b { font:700 clamp(22px, 6.5vw, 34px) 'Cinzel Decorative', Georgia, serif; color:#ffe3a1; text-shadow:0 2px 8px #000; }
  @keyframes faixa { 0% { opacity:0; transform:scaleY(0); } 15%, 80% { opacity:1; transform:none; } 100% { opacity:0; transform:translateY(-20px); } }
  .voando { position:fixed; z-index:9000; pointer-events:none; filter:drop-shadow(0 0 12px #ffd36e); }

  .final { overflow-x:hidden; }
  .coracao { position:fixed; bottom:-40px; font-size:26px; pointer-events:none; z-index:6001; animation:subir-coracao 7s ease-in infinite; }

  .despedida { font:700 clamp(22px, 6vw, 30px) 'Cinzel Decorative', Georgia, serif; color:var(--ruby2); margin:6px 0 18px; }

  .creditos dd { margin:2px 0 0; font:600 17px/1.3 Alegreya, Georgia, serif; color:var(--ink); }
  .creditos dt, .creditos dd { animation:in .6s ease both; }
  .creditos-fim { margin:16px 0 0; font-style:italic; color:var(--ink2); }
  .answers.cortejo button { flex-direction:column; align-items:flex-start; gap:2px; }
  .answers.cortejo button::before { display:none; }
  .answers.cortejo small { font-weight:600; font-size:13px; opacity:.7; }
  .answers.cortejo button.dica { border-color:var(--gold); box-shadow:0 0 0 3px var(--gold), 0 0 16px #ffd36e; }
  .cortejo-feito { text-align:left; margin:0 0 12px; padding-left:24px; font-weight:700; color:var(--emerald); }

  /* nome e cargo dos moradores; aceno quando ela chega perto */
  .mundo .npc small { display:flex; flex-direction:column; align-items:center; line-height:1.05; border-radius:9px; padding:2px 8px 3px; }
  .mundo .npc small em { font-style:normal; font-weight:600; font-size:.78em; color:var(--gold2); letter-spacing:.03em; }
  .mundo .npc.perto small em { color:#5a3a10; }
  .mundo .npc.perto img { animation:oi .8s ease-in-out infinite; }
  @keyframes oi { 0%, 100% { transform:none; } 30% { transform:translateY(-7%); } 55% { transform:translateY(0) scale(1.04, .96); } }
  .fala-cargo { font:700 13px 'Alegreya Sans', sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); opacity:.85; }

  /* menino, cachorro e gato passeando; borboletas no jardim */
  .bicho { position:absolute; translate:-50% -100%; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .bicho .sombra { position:absolute; left:50%; bottom:0; width:80%; height:1.2cqh; translate:-50% 35%; border-radius:50%; background:radial-gradient(#0009, transparent 70%); }

  .bicho.andando img { animation:andar .32s ease-in-out infinite; }

  @keyframes pulinho { 40% { transform:translateY(-22%); } }
  .fala-bicho { position:absolute; bottom:100%; left:50%; translate:-50% -4px; white-space:nowrap; pointer-events:none; animation:pop .3s ease;
    font:800 max(12px, 1.4cqh) 'Alegreya Sans', sans-serif; color:#3e2405; background:#fff8e6; border:2px solid var(--gold3); border-radius:12px; padding:3px 9px; }
  .borboleta { position:absolute; font-size:max(14px, 1.8cqh); pointer-events:none; z-index:1300; animation:borboleta 7s ease-in-out infinite; }
  @keyframes borboleta { 0%, 100% { transform:translate(0, 0); } 25% { transform:translate(4cqh, -3cqh) scaleX(.6); } 50% { transform:translate(7cqh, 1cqh); } 75% { transform:translate(2cqh, 3cqh) scaleX(.6); } }

  /* Poeta: palavras embaralhadas */
  .slots { display:flex; justify-content:center; gap:4px; margin:8px 0 18px; }
  .slots span { width:clamp(24px, 7.5vw, 40px); height:46px; display:grid; place-items:center; border-bottom:3px solid var(--gold3); font:800 26px Alegreya, Georgia, serif; color:var(--ink); }

// Randerson (padrinho): palavras do casamento embaralhadas (dica e resposta)
const PALAVRAS = [

// Pastor Lucas: versículos de 1 Coríntios 13 (NVI)
const VERSICULOS = [

const CORTEJO = [

// Henrique: jogo da memória com coisas do casamento (arquivo em img/ e nome lido pelo leitor de tela)
const PARES = [['aliancas', 'alianças'], ['bolo-casamento', 'bolo de casamento'], ['gravata', 'gravata-borboleta'], ['veu', 'véu'], ['sino', 'sino'], ['convite', 'convite']];
// créditos no final, como o cortejo
const CREDITOS = [

  ['Pais da noiva', 'Seu Diego e Dona Fran'],

  ['Plaquinha e Bíblia', 'Manu e Isabela'],

  ['Demoiselles', 'Anna Isabel, Isabella, Gabriela e Sthefany'],
  ['Placa “Lá vem a noiva”', 'Henrique'],

  ['Mascote da vila', 'Snow'],

const FINAL = {
  kicker: 'Você me encontrou!',
  titulo: `Feliz aniversário, ${ELA}!`,
  premio: 'Como no dia 01/08, você atravessou o caminho e me encontrou no fim dele. O prêmio desta aventura... sou eu! Te amo mil milhões. E com ele vêm estes vales:',
  vales: ['Um jantar com todos que amamos, a família reunida', 'Um dia inteiro juntinhos na segunda, dia 30: nós dois vendo filmes até a hora de sair com todos que amamos', 'Beijinhos e abraços ilimitados, sem prazo de validade'],
  despedida: 'Até o infinito e amém!',
};
// ===============================================================================================

const app = document.getElementById('app'), painel = document.getElementById('painel');
const mundoEl = document.getElementById('mundo'), jogoEl = document.getElementById('jogo'), avisoEl = document.getElementById('aviso');
const falaEl = document.getElementById('fala'), acaoEl = document.getElementById('acao'), topoEl = document.getElementById('topo');
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let cap = -1, xp = 0;  // cap = capítulo atual (0..7); 8 = carta completa, castelo aberto
const lvl = () => 1 + Math.floor(xp / 100);

// ---- progresso salvo neste navegador ----
const CHAVE = 'aventura-v2';  // v2: 8 capítulos (o progresso da versão de 5 recomeça)
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify({ cap, xp })); } catch {} };
const carregar = () => { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch { return null; } };

// ---- fanfarra e confete ----
let mudo = (() => { try { return localStorage.getItem('aventura-mudo') === '1'; } catch { return false; } })();
const FANFARRA = new Audio('sons/fanfarra.mp3'); FANFARRA.preload = 'auto'; FANFARRA.volume = .6;
function fanfarra() { if (mudo) return; FANFARRA.currentTime = 0; FANFARRA.play().catch(() => {}); }
function confete() {
  if (reduz) return;
  const c = document.createElement('canvas'); c.className = 'confete'; c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const g = c.getContext('2d'), cores = ['#e3ae4a', '#ffe3a1', '#a8323f', '#2f8f5b', '#3c63b8', '#f0a3b8'];
  const p = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3,
    vy: 2 + Math.random() * 3, r: Math.random() * 6, s: 5 + Math.random() * 6, cor: cores[Math.random() * cores.length | 0] }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    p.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += .1; g.save(); g.translate(q.x, q.y); g.rotate(q.r); g.fillStyle = q.cor; g.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); g.restore(); });
    if (++f < 200) requestAnimationFrame(tick); else c.remove();
  })();
}

// ---- HUD por cima do mapa: retrato, nível, pedaços da carta e som ----
function hud(brilho) {
  topoEl.innerHTML = `<div class="perfil${brilho ? ' ganhou' : ''}"><img src="img/aventureira.webp" alt="Retrato de ${ELA}">
      <div><b>${ELA}</b> <span class="lv">Nv ${lvl()}</span><div class="bar" role="progressbar" aria-label="Experiência" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${xp % 100}"><i style="width:${xp % 100}%"></i></div></div></div>
    <ol class="pedacos" aria-label="Pedaços da carta: ${Math.max(0, cap)} de ${CAPITULOS.length}">${CAPITULOS.map((c, i) => `<li class="${i < cap ? 'tem' : ''}" data-i="${i}"><img src="img/${c.icone}.webp" alt=""></li>`).join('')}</ol>
    <button class="mudo" aria-label="${mudo ? 'Ligar os sons' : 'Desligar os sons'}" aria-pressed="${mudo}">${mudo ? '🔇' : '🔊'}</button>`;
  topoEl.querySelector('.mudo').onclick = () => { mudo = !mudo; try { localStorage.setItem('aventura-mudo', mudo ? '1' : '0'); } catch {} hud(); };
}

// ================= O MUNDO: mapa maior que a tela, câmera, controles e colisão =================
// moradores na ordem dos capítulos (NPCS[i] dá o capítulo i); a = artigo ("falar com o/a ...")
const NPCS = [
  { nome: 'Seu Diego', cargo: 'Pai da noiva', a: 'o', img: 'npc-diego', x: 39, y: 80.5 },
  { nome: 'Dona Fran', cargo: 'Mãe da noiva', a: 'a', img: 'npc-fran', x: 61, y: 76.5 },
  { nome: 'Randerson', cargo: 'Irmão e padrinho', a: 'o', img: 'npc-randerson', x: 62, y: 60 },
  { nome: 'Radmila', cargo: 'Irmã e madrinha', a: 'a', img: 'npc-radmila', x: 24, y: 57 },
  { nome: 'Henrique', cargo: 'Pajem da placa', a: 'o', img: 'npc-henrique', x: 43, y: 47.5 },
  { nome: 'Rangel e Ciane', cargo: 'Pais do Henrique e da Bel', a: '', img: 'npc-rangel-ciane', x: 65, y: 44.5 },
  { nome: 'Pastora Luzia', cargo: 'Pastora e cantora', a: 'a', img: 'npc-luzia', x: 75, y: 22 },
  { nome: 'Pastor Lucas', cargo: 'Pastor metodista', a: 'o', img: 'npc-pastor', x: 58, y: 21.5 },
  { nome: 'Cayo', cargo: 'O padrinho mais top', a: 'o', img: 'npc-cayo', x: 39, y: 20.5 },
];
const com = n => (n.a ? `${n.a} ${n.nome}` : n.nome);
// quem anda sozinho pela vila (h = altura em % da altura do mapa; casa = onde passeia)
const BICHOS = [
  { img: 'amb-theo', nome: 'Theo', h: 5.6, casa: { x: 32, y: 53 }, raio: 9, vel: .09, diz: ['Tia Vitória! 🎈', 'Eu levei as alianças! 💍', 'Hihihi! 😄', 'Vamos brincar?'] },
  { img: 'amb-snow', nome: 'Snow', h: 5.4, casa: { x: 50, y: 88 }, raio: 14, vel: .13, diz: ['Au au! ❤️', 'Au! 🐾', '*abana o rabo*', '*pede carinho*'] },
  { img: 'amb-bel', nome: 'Bel', h: 7.4, casa: { x: 58, y: 48 }, raio: 6, vel: .08, diz: ['Eu fui demoiselle! 💃', 'Feliz aniversário, Vitória! 🎉', 'Nesta noite o amor chegou! 🎶', 'O Henrique é meu irmão!'] },
  { img: 'amb-gato', nome: 'Paçoca', h: 4.2, casa: { x: 47, y: 31 }, raio: 9, vel: .06, diz: ['Miau 💛', 'Purr...', '*se espreguiça*'] },
];
const PORTAO = { x: 50.5, y: 17 }, INICIO = { x: 50, y: 89.5 };
// áreas bloqueadas do mapa, em % (x0, y0, x1, y1): castelo, morros, loja, barraca, tenda, torre e bordas
const BLOQUEIOS = [[20, 0, 80, 17.5], [0, 0, 18, 22], [82, 0, 100, 21], [53, 23, 91, 38], [69, 38, 87, 46], [17, 33, 43, 45], [13.5, 40.5, 25, 50],
  [8, 61, 37, 79], [70, 49.5, 90, 80], [0, 0, 8.5, 100], [91.5, 0, 100, 100], [0, 96.5, 100, 100]];
const livre = (x, y) => !BLOQUEIOS.some(([a, b, c, d]) => x > a && x < c && y > b && y < d);
const heroi = { x: INICIO.x, y: INICIO.y, esq: false };
let W = 0, H = 0, camX = 0, camY = 0, alvo = null, aoChegar = null, perto = null;
const joy = { x: 0, y: 0 }, teclas = new Set();
const pausado = () => !painel.hidden || !falaEl.hidden || !document.getElementById('final').hidden;

function medir() {
  const vw = jogoEl.clientWidth, vh = jogoEl.clientHeight;
  W = Math.round(Math.min(vw * 1.55, vh * 1.02)); H = Math.round(W * 1376 / 768);
  mundoEl.style.width = `${W}px`; mundoEl.style.height = `${H}px`;
  camera(true);
}
function montarMundo() {
  mundoEl.insertAdjacentHTML('beforeend', NPCS.map((n, i) => `<button class="npc" data-i="${i}" style="left:${n.x}%;top:${n.y}%;z-index:${Math.round(n.y * 10)};animation-delay:${-i * .7}s">
      <span class="balao" aria-hidden="true"></span><img src="img/${n.img}.webp" alt=""><small><b>${n.nome}</b><em>${n.cargo}</em></small></button>`).join('')
    + `<button class="portao" style="left:${PORTAO.x}%;top:${PORTAO.y}%"><span class="balao" aria-hidden="true"></span></button>`
    + `<div class="heroi" id="heroi"><span class="sombra"></span><img src="img/heroi-vitoria.webp" alt="${ELA}, a aventureira"></div>`
    + Array.from({ length: reduz ? 0 : 18 }, () => `<i class="brilho" style="left:${10 + Math.random() * 80}%;top:${14 + Math.random() * 80}%;animation-delay:${-Math.random() * 8}s;animation-duration:${6 + Math.random() * 6}s"></i>`).join('')
    + BICHOS.map((b, i) => `<button class="bicho" data-b="${i}" aria-label="${b.nome}"><span class="sombra"></span><img src="img/${b.img}.webp" alt="" style="height:${b.h}cqh"></button>`).join('')
    + (reduz ? '' : '<i class="nuvem n1"></i><i class="nuvem n2"></i>' + [[27, 55], [33, 60], [58, 63]].map(([x, y], i) => `<i class="borboleta" style="left:${x}%;top:${y}%;animation-delay:${-i * 2.3}s">🦋</i>`).join('')));
  BICHOS.forEach((b, i) => { Object.assign(b, { x: b.casa.x, y: b.casa.y, alvo: null, espera: Math.random() * 2, esq: false, el: mundoEl.querySelector(`.bicho[data-b="${i}"]`) });
    Object.assign(b.el.style, { left: `${b.x}%`, top: `${b.y}%`, zIndex: Math.round(b.y * 10) });
    b.el.onclick = e => { e.stopPropagation(); balaozinho(b); }; });
  mundoEl.querySelectorAll('.npc').forEach(b => b.onclick = e => { e.stopPropagation(); irAte(NPCS[+b.dataset.i], () => falarCom(+b.dataset.i)); });
  mundoEl.querySelector('.portao').onclick = e => { e.stopPropagation(); irAte({ x: PORTAO.x + 8, y: PORTAO.y + 3 }, irAoPortao); };
  // toque no chão: anda até lá (o joystick tem prioridade)
  mundoEl.addEventListener('pointerdown', e => {
    if (pausado() || e.target.closest('button')) return;
    const r = mundoEl.getBoundingClientRect();
    alvo = { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 }; aoChegar = null;
    marcarAlvo(alvo);
  });
  medir(); addEventListener('resize', medir);
  requestAnimationFrame(passo);
}
// chega perto de algo antes de interagir
function irAte(p, depois) {
  if (pausado()) return;
  const lado = p.x > 50 ? -7 : 7;
  const dest = [[lado, 2], [lado, -1.5], [-lado, 2], [0, 3], [-lado, -1.5]].map(([dx, dy]) => ({ x: p.x + dx, y: p.y + dy })).find(q => livre(q.x, q.y)) || { x: p.x + lado, y: p.y + 2 };
  const via = rota(heroi, dest);
  if (via) { alvo = via; aoChegar = () => irAte(p, depois); } else { alvo = dest; aoChegar = depois; }
  marcarAlvo(dest);
}
// se uma construção está no meio, passa antes por um ponto da estrada de pedras
const ESTRADA = [{ x: 50, y: 88 }, { x: 47, y: 75 }, { x: 50, y: 62 }, { x: 46, y: 50 }, { x: 48, y: 38 }, { x: 50, y: 27 }, { x: 51, y: 20.5 }];
const limpo = (a, b) => Array.from({ length: 41 }, (_, k) => k / 40).every(f => livre(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f));
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rota(de, para) {
  if (limpo(de, para)) return null;
  const vistos = ESTRADA.filter(w => dist2(w, de) > 2 && limpo(de, w));
  return vistos.filter(w => limpo(w, para)).sort((a, b) => dist2(de, a) + dist2(a, para) - dist2(de, b) - dist2(b, para))[0]
    || vistos.sort((a, b) => dist2(a, para) - dist2(b, para))[0] || null;
}
function marcarAlvo(p) {
  if (reduz) return;
  const m = document.createElement('i'); m.className = 'marca'; m.style.left = `${p.x}%`; m.style.top = `${p.y}%`;
  mundoEl.append(m); setTimeout(() => m.remove(), 700);
}
let ultimo = 0, ultimaPoeira = 0, travado = 0;
function passo(t) {
  const dt = Math.min(.05, (t - (ultimo || t)) / 1000); ultimo = t;
  let vx = joy.x + (teclas.has('d') - teclas.has('a')), vy = joy.y + (teclas.has('s') - teclas.has('w'));
  const manual = Math.hypot(vx, vy) > .15;
  if (manual) { alvo = null; aoChegar = null; }
  else if (alvo) {
    const dx = (alvo.x - heroi.x) * W / 100, dy = (alvo.y - heroi.y) * H / 100, d = Math.hypot(dx, dy);
    if (d < 6) { alvo = null; const f = aoChegar; aoChegar = null; f?.(); vx = vy = 0; } else { vx = dx / d; vy = dy / d; }
  }
  const mov = Math.hypot(vx, vy);
  const el = document.getElementById('heroi');
  if (mov > .15 && !pausado()) {
    if (mov > 1) { vx /= mov; vy /= mov; }
    const vel = W * .3 * dt;  // ~30% da largura do mapa por segundo
    const nx = heroi.x + vx * vel / W * 100, ny = heroi.y + vy * vel / H * 100;
    const antes = [heroi.x, heroi.y];
    if (livre(nx, ny)) { heroi.x = nx; heroi.y = ny; }
    else if (livre(nx, heroi.y)) heroi.x = nx;   // desliza pela parede
    else if (livre(heroi.x, ny)) heroi.y = ny;
    const andou = heroi.x !== antes[0] || heroi.y !== antes[1];
    if (Math.abs(vx) > .2) heroi.esq = vx < 0;
    el.classList.toggle('andando', andou);
    if (!andou && alvo && ++travado > 20) { alvo = null; aoChegar = null; travado = 0; }   // bateu numa parede: desiste
    if (andou) { travado = 0; if (t - ultimaPoeira > 170 && !reduz) { ultimaPoeira = t; poeira(); } }
  } else el.classList.remove('andando');
  el.classList.toggle('esquerda', heroi.esq);
  el.style.left = `${heroi.x}%`; el.style.top = `${heroi.y}%`; el.style.zIndex = Math.round(heroi.y * 10) + 1;
  passear(dt);
  camera(false);
  vizinho();
  requestAnimationFrame(passo);
}
// menino, cachorro e gato passeiam sozinhos: escolhem um ponto livre perto de casa, andam, param um pouco
function passear(dt) {
  BICHOS.forEach(b => {
    if (!b.alvo) {
      if ((b.espera -= dt) > 0 || reduz) return;
      for (let k = 0; k < 12 && !b.alvo; k++) {
        const a = Math.random() * Math.PI * 2, r = Math.random() * b.raio, p = { x: b.casa.x + Math.cos(a) * r, y: b.casa.y + Math.sin(a) * r * .6 };
        if (livre(p.x, p.y) && !NPCS.some(n => Math.hypot(n.x - p.x, n.y - p.y) < 5)) b.alvo = p;
      }
      if (!b.alvo) { b.espera = 1; return; }
    }
    const dx = (b.alvo.x - b.x) * W / 100, dy = (b.alvo.y - b.y) * H / 100, d = Math.hypot(dx, dy), v = W * b.vel * dt;
    if (d <= v) { b.x = b.alvo.x; b.y = b.alvo.y; b.alvo = null; b.espera = 1.5 + Math.random() * 3.5; }
    else { b.x += dx / d * v / W * 100; b.y += dy / d * v / H * 100; if (Math.abs(dx) > 2) b.esq = dx < 0; }
    b.el.classList.toggle('andando', !!b.alvo); b.el.classList.toggle('esquerda', b.esq);
    b.el.style.left = `${b.x}%`; b.el.style.top = `${b.y}%`; b.el.style.zIndex = b.falando ? 1600 : Math.round(b.y * 10);
  });
}
function balaozinho(b) {
  b.el.querySelector('.fala-bicho')?.remove();
  const f = document.createElement('span'); f.className = 'fala-bicho'; f.setAttribute('role', 'status');
  f.textContent = `${b.nome}: ${b.diz[Math.random() * b.diz.length | 0]}`; b.el.append(f);
  b.el.classList.remove('feliz'); void b.el.offsetWidth; b.el.classList.add('feliz');
  b.falando = true; b.el.style.zIndex = 1600;  // balão por cima dos nomes dos moradores
  clearTimeout(b.tFala); b.tFala = setTimeout(() => { f.remove(); b.falando = false; b.el.style.zIndex = Math.round(b.y * 10); }, 2600);
}
function poeira() {
  const p = document.createElement('i'); p.className = 'poeira'; p.style.left = `${heroi.x}%`; p.style.top = `${heroi.y}%`;
  mundoEl.append(p); setTimeout(() => p.remove(), 600);
}
function camera(direto) {
  const vw = jogoEl.clientWidth, vh = jogoEl.clientHeight;
  const hx = heroi.x * W / 100, hy = heroi.y * H / 100 - vh * .06;
  const tx = W <= vw ? (vw - W) / 2 : -Math.min(W - vw, Math.max(0, hx - vw / 2));
  const ty = H <= vh ? (vh - H) / 2 : -Math.min(H - vh, Math.max(0, hy - vh / 2));
  const k = direto || reduz ? 1 : .14;
  camX += (tx - camX) * k; camY += (ty - camY) * k;
  mundoEl.style.transform = `translate3d(${camX.toFixed(1)}px, ${camY.toFixed(1)}px, 0)`;
}
// quem está perto? mostra o botão de ação
function vizinho() {
  if (pausado()) { acaoEl.hidden = true; return; }
  const dist = p => Math.hypot((p.x - heroi.x) * W / 100, (p.y - heroi.y) * H / 100);
  let achou = null;
  NPCS.forEach((n, i) => { if (dist(n) < W * .13 && (!achou || dist(n) < achou.d)) achou = { tipo: 'npc', i, d: dist(n) }; });
  if (!achou && dist({ x: PORTAO.x, y: PORTAO.y + 3 }) < W * .16) achou = { tipo: 'portao' };
  const chave = achou ? achou.tipo + (achou.i ?? '') : '';
  if (chave === (perto?.chave ?? '')) return;
  perto = achou ? { ...achou, chave } : null;
  mundoEl.querySelectorAll('.npc').forEach((b, i) => b.classList.toggle('perto', perto?.tipo === 'npc' && perto.i === i));
  acaoEl.hidden = !perto;
  if (perto) acaoEl.innerHTML = perto.tipo === 'npc' ? `💬 Falar com ${com(NPCS[perto.i])}` : (cap >= CAPITULOS.length ? '🏰 Entrar no castelo' : '🔒 Portão trancado');
}
function agir() { if (!perto || pausado()) return; perto.tipo === 'npc' ? falarCom(perto.i) : irAoPortao(); }
acaoEl.onclick = agir;

// joystick: arrastar a partir da base
(() => {
  const base = document.getElementById('stick'), bola = base.querySelector('i');
  let id = null;
  const mover = e => {
    const r = base.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, raio = r.width / 2;
    let dx = (e.clientX - cx) / raio, dy = (e.clientY - cy) / raio; const d = Math.hypot(dx, dy);
    if (d > 1) { dx /= d; dy /= d; }
    joy.x = dx; joy.y = dy; bola.style.transform = `translate(${dx * raio * .55}px, ${dy * raio * .55}px)`;
  };
  base.addEventListener('pointerdown', e => { id = e.pointerId; base.setPointerCapture(id); base.classList.add('ativo'); mover(e); e.preventDefault(); });
  base.addEventListener('pointermove', e => { if (e.pointerId === id) mover(e); });
  const soltar = e => { if (e.pointerId !== id) return; id = null; joy.x = joy.y = 0; bola.style.transform = ''; base.classList.remove('ativo'); };
  base.addEventListener('pointerup', soltar); base.addEventListener('pointercancel', soltar);
})();
// teclado: setas/WASD andam; Enter/Espaço/E falam; Esc fecha
const MAPA_TECLAS = { arrowup: 'w', w: 'w', arrowdown: 's', s: 's', arrowleft: 'a', a: 'a', arrowright: 'd', d: 'd' };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') { if (!painel.hidden) (aoFechar || fecharPainel)(); else if (!falaEl.hidden) fecharFala(); return; }
  if (pausado() || e.target.closest?.('input, textarea')) return;
  if (MAPA_TECLAS[k]) { teclas.add(MAPA_TECLAS[k]); e.preventDefault(); }
  else if ((k === 'enter' || k === ' ' || k === 'e') && perto && !e.target.closest?.('button')) { agir(); e.preventDefault(); }
});
addEventListener('keyup', e => { const k = MAPA_TECLAS[e.key.toLowerCase()]; if (k) teclas.delete(k); });
addEventListener('blur', () => teclas.clear());

function desenharMundo() {

// ================= FALAS (caixa de diálogo de RPG, letra por letra) =================
let digitando = null;
function falar(i, texto, botoes) {
  const n = NPCS[i];
  falaEl.innerHTML = `<div class="fala-caixa" role="dialog" aria-modal="true" aria-label="${n.nome}, ${n.cargo}">
      <img class="fala-rosto" src="img/${n.img}.webp" alt=""><div class="fala-corpo"><b class="fala-nome">${n.nome}</b> <span class="fala-cargo">${n.cargo}</span>
      <p class="fala-texto" aria-live="polite"></p><div class="fala-botoes">${botoes.map(([t, cls], k) => `<button class="${cls || ''}" data-k="${k}">${t}</button>`).join('')}</div></div></div>`;
  falaEl.hidden = false;
  const p = falaEl.querySelector('.fala-texto'), bts = falaEl.querySelector('.fala-botoes');

// ================= PAINEL (desafios, prólogo, pedaços) =================
let aoFechar = null;
function fecharPainel() { painel.hidden = true; pararJogo(); hud(); desenharMundo(); }
const iconeCap = i => `<div class="crest"><img src="img/${CAPITULOS[i].icone}.webp" alt=""></div>`;
function view(html, topo, brilho) {

}
const on = (sel, fn) => app.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b.dataset.v, b));

function start() {
  const s = carregar();
  hud(); desenharMundo();
  if (s && s.cap >= 0) { cap = s.cap; xp = s.xp || 0; hud(); desenharMundo();
    return aviso(cap >= CAPITULOS.length ? 'A carta está completa! Suba até o castelo.' : `Bem-vinda de volta! Fale com ${com(NPCS[cap])}.`); }
  view(`<p class="kicker">${PROLOGO.kicker}</p><h1>${PROLOGO.titulo}</h1>${PROLOGO.texto}
    <div class="dica-jogo"><b>Como jogar:</b> use o controle no canto da tela (ou as setas do teclado) para andar, ou toque no mapa. Chegou perto de alguém, toque em <b>Falar</b>. Quem tem um desafio pra você mostra um <b>!</b> dourado.</div>
    <button class="primary">${PROLOGO.botao}</button>`, `<div class="crest"><img class="face" src="img/aventureira.webp" alt="${ELA}"></div>`);
  const comecar = () => { cap = 0; xp = 0; salvar(); fecharPainel(); aviso(`Comece pelo seu pai, o ${NPCS[0].nome}, perto da tenda, aqui pertinho!`); };
  on('.primary', comecar); aoFechar = comecar;
}
async function falarCom(i) {
  if (pausado() || cap < 0) return;
  const n = NPCS[i];
  if (i < cap) return falar(i, `${n.a === 'a' ? 'Obrigada' : 'Obrigado'}, ${ELA}! O pedaço ${i + 1} já está com você. Corre, que o ${ELE} está esperando!`, [['Até mais!', 'primary']]);
  if (i > cap) return falar(i, `Ainda não é a minha vez! Primeiro fale com ${com(NPCS[cap])} (${NPCS[cap].cargo}).`, [['Entendi', 'primary']]);
  const c = CAPITULOS[cap];
  const k = await falar(i, c.fala, [['Aceitar o desafio', 'primary'], ['Agora não', 'ghost']]);
  if (k !== 0) return;
  await faixaCapitulo(cap);
  JOGOS[c.jogo](capituloCompleto);
}
function faixaCapitulo(i) {

    if (reduz) return res();
    const f = document.createElement('div'); f.className = 'faixa';
    f.innerHTML = `<small>Capítulo ${i + 1} de ${CAPITULOS.length}</small><b>${CAPITULOS[i].titulo}</b>`;

function capituloCompleto() {

    <button class="primary">${ultimo ? 'A carta está completa! Ir ao castelo' : 'Guardar na mochila'}</button>`, iconeCap(i), true);
  const voltar = () => { fecharPainel(); voar(i); aviso(ultimo ? 'O portão do castelo se abriu! Suba até lá.' : `Próxima parada: ${NPCS[cap].nome} (${NPCS[cap].cargo}).`); };

// o ícone do pedaço voa até o lugar dele no topo
function voar(i) {

    .onfinish = () => { img.remove(); dest.classList.add('chegou'); setTimeout(() => dest.classList.remove('chegou'), 600); };

function irAoPortao() {

// ================= MINIJOGOS =================
let timers = [], quadro = null;
function pararJogo() { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; cancelAnimationFrame(quadro); }
const depois = (ms, fn) => timers.push(setTimeout(fn, ms));
const topoJogo = () => iconeCap(cap);

const JOGOS = {
  // 1. Charadas: três perguntas de múltipla escolha; errar não tem castigo
  charadas(fim, k = 0, lista = CHARADAS, nome = 'Pergunta') {
    const q = lista[k];
    view(`<p class="kicker">${nome} ${k + 1} de ${lista.length}</p><h2>${q.p}</h2>
      <div class="answers">${embaralhar(q.o.map((t, j) => [t, j])).map(([t, j]) => `<button data-v="${j}">${t}</button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    on('.answers button', (v, b) => {
      if (+v === q.c) { b.classList.add('certo'); depois(500, () => k + 1 < lista.length ? JOGOS.charadas(fim, k + 1, lista, nome) : fim()); }
      else { b.classList.add('errado'); b.disabled = true; app.querySelector('#msg').textContent = 'Quase! Tenta outra.'; }
    });
  },
  // 2. Relógio: pare o ponteiro na faixa dourada (perto das 12) três vezes; fica mais rápido a cada acerto
  relogio(fim) {
    let acertos = 0, ang = 0, ult = 0, rodando = true;
    const vel = () => (reduz ? 90 : 150) + acertos * 55;
    view(`<p class="kicker">A hora certa · ${acertos}/3</p><h2>Pare na faixa dourada!</h2>
      <svg class="relogio" viewBox="-110 -110 220 220" role="img" aria-label="Relógio com ponteiro girando">
        <circle r="100" fill="#fffaf0" stroke="#9a6a1f" stroke-width="8"/>
        <path d="M0 0 L${100 * Math.sin(-.42)} ${-100 * Math.cos(-.42)} A100 100 0 0 1 ${100 * Math.sin(.42)} ${-100 * Math.cos(.42)} Z" fill="#f2c45a"/>
        ${Array.from({ length: 12 }, (_, h) => `<line x1="0" y1="-86" x2="0" y2="-96" stroke="#5a432c" stroke-width="4" transform="rotate(${h * 30})"/>`).join('')}
        <g id="ponteiro"><line x1="0" y1="12" x2="0" y2="-80" stroke="#a8323f" stroke-width="7" stroke-linecap="round"/></g>
        <circle r="9" fill="#5a432c"/></svg>
      <button class="primary" id="parar">Parar!</button><p class="note" id="msg" role="status"></p>`, topoJogo());
    const pont = app.querySelector('#ponteiro'), kick = app.querySelector('.kicker'), msg = app.querySelector('#msg');
    const girar = t => { if (rodando) { ang = (ang + (t - (ult || t)) / 1000 * vel()) % 360; pont.setAttribute('transform', `rotate(${ang})`); } ult = t; quadro = requestAnimationFrame(girar); };
    quadro = requestAnimationFrame(girar);
    const parar = () => {
      if (!rodando) return;
      rodando = false;
      const d = Math.min(ang, 360 - ang);
      if (d <= 24) { acertos++; kick.textContent = `A hora certa · ${acertos}/3`; msg.textContent = acertos < 3 ? 'Na hora certinha! De novo, agora mais rápido.' : 'Perfeito!';
        if (acertos >= 3) return depois(700, fim); }
      else msg.textContent = 'Passou da hora! Tenta de novo.';
      depois(800, () => { msg.textContent = ''; rodando = true; ult = 0; });
    };
    app.querySelector('#parar').onclick = parar;
    app.querySelector('.relogio').onclick = parar;
  },
  // Poeta: desembaralhar as palavras do casamento (toque nas letras na ordem; Apagar desfaz)
  palavras(fim, k = 0) {
    const { dica, p } = PALAVRAS[k], certa = [...p];
    let letras; do letras = embaralhar(certa); while (letras.join('') === p);
    let escolha = [];
    view(`<p class="kicker">Palavra ${k + 1} de ${PALAVRAS.length}</p><h2>${dica}</h2>
      <div class="slots" aria-live="polite">${certa.map(() => '<span></span>').join('')}</div>
      <div class="letras">${letras.map((l, i) => `<button data-v="${i}">${l}</button>`).join('')}</div>
      <button class="ghost" id="apagar">Apagar</button><p class="note" id="msg" role="status"></p>`, topoJogo());
    const caixa = app.querySelector('.slots'), slots = [...caixa.children], bts = [...app.querySelectorAll('.letras button')], msg = app.querySelector('#msg');
    const pintar = () => slots.forEach((el, i) => { el.textContent = escolha[i] != null ? letras[escolha[i]] : ''; el.classList.toggle('cheio', escolha[i] != null); });
    bts.forEach(b => b.onclick = () => {
      if (b.disabled || escolha.length >= certa.length) return;
      escolha.push(+b.dataset.v); b.disabled = true; pintar();
      if (escolha.length < certa.length) return;
      if (escolha.map(i => letras[i]).join('') === p) { caixa.classList.add('certo'); msg.textContent = 'Lindo!'; depois(900, () => k + 1 < PALAVRAS.length ? JOGOS.palavras(fim, k + 1) : fim()); }
      else { caixa.classList.add('errado'); msg.textContent = 'Quase! Tenta outra ordem.';
        depois(800, () => { escolha = []; bts.forEach(x => x.disabled = false); caixa.classList.remove('errado'); pintar(); }); }
    });
    app.querySelector('#apagar').onclick = () => { if (escolha.length >= certa.length) return; const i = escolha.pop(); if (i != null) bts[i].disabled = false; pintar(); };
  },
  // Jardineira: quebra-cabeça 3x3 com o quadro do casal; toque em duas peças para trocar
  quebracabeca(fim) {
    const N = 9, ok = o => o.every((v, i) => v === i);
    let ordem; do ordem = embaralhar([...Array(N).keys()]); while (ok(ordem));
    let sel = null, jogadas = 0;
    view(`<p class="kicker">Jogadas: <span id="jog">0</span></p><h2>Monte o quadro!</h2>
      <div class="quebra" role="group" aria-label="Quebra-cabeça de 9 peças">${ordem.map((_, i) => `<button class="peca" data-v="${i}"></button>`).join('')}</div>
      <p class="note" id="msg" role="status">Toque em uma peça e depois em outra para trocar as duas de lugar.</p>`, topoJogo());
    const pecas = [...app.querySelectorAll('.peca')], tela = app.querySelector('.quebra');
    const pintar = () => pecas.forEach((b, pos) => { const v = ordem[pos];
      b.style.backgroundPosition = `${v % 3 * 50}% ${(v / 3 | 0) * 50}%`; b.classList.toggle('certa', v === pos);
      b.setAttribute('aria-label', `Posição ${pos + 1}: peça ${v + 1}${v === pos ? ', no lugar' : ''}`); });
    pintar();
    pecas.forEach((b, pos) => b.onclick = () => {
      if (tela.classList.contains('pronto')) return;
      if (sel === null) { sel = pos; b.classList.add('sel'); return; }
      pecas[sel].classList.remove('sel');
      if (sel !== pos) { [ordem[sel], ordem[pos]] = [ordem[pos], ordem[sel]]; app.querySelector('#jog').textContent = ++jogadas; pintar(); }
      sel = null;
      if (ok(ordem)) { tela.classList.add('pronto'); app.querySelector('#msg').textContent = 'Que quadro lindo! Vocês dois no jardim.'; depois(1600, fim); }
    });
  },
  // Pastor: completar versículos de 1 Coríntios 13 (mesmo formato das charadas)
  versiculos(fim) { JOGOS.charadas(fim, 0, VERSICULOS, 'Versículo'); },
  // 3. Bolo: toque nos ingredientes de bolo que aparecem; cebola, pimenta e alho tiram ponto
  bolo(fim) {
    const BONS = ['🥚', '🍓', '🍫', '🥛', '🧈', '🍯', '🍒'], RUINS = ['🧅', '🌶️', '🧄'], META = 10;
    const NOMES = { '🥚':'ovo', '🍓':'morango', '🍫':'chocolate', '🥛':'leite', '🧈':'manteiga', '🍯':'mel', '🍒':'cereja', '🧅':'cebola', '🌶️':'pimenta', '🧄':'alho' };
    const marcar = (b, it) => { b.dataset.item = it; b.textContent = it; b.setAttribute('aria-label', it ? NOMES[it] : 'Espaço vazio'); };
    let pontos = 0, tempo = 40;
    view(`<p class="kicker">Ingredientes: <span id="pts">0</span>/${META} · <span id="tmp">${tempo}</span>s</p><h2>Pegue os ingredientes do bolo!</h2>
      <div class="bar bolo-barra"><i id="prog" style="width:0%"></i></div>
      <div class="buracos">${Array.from({ length: 9 }, (_, i) => `<button class="buraco" data-v="${i}" aria-label="Espaço vazio"></button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    const casas = [...app.querySelectorAll('.buraco')], msg = app.querySelector('#msg');
    const atualizar = () => { app.querySelector('#pts').textContent = pontos; app.querySelector('#prog').style.width = `${pontos / META * 100}%`; };
    casas.forEach(b => b.onclick = () => {
      const it = b.dataset.item; if (!it) return;
      marcar(b, '');
      if (BONS.includes(it)) { pontos++; b.classList.add('pegou'); depois(250, () => b.classList.remove('pegou')); }
      else { pontos = Math.max(0, pontos - 1); b.classList.add('errado'); msg.textContent = 'Eca! Isso não vai no bolo.'; depois(400, () => b.classList.remove('errado')); }
      atualizar();
      if (pontos >= META) { pararJogo(); msg.textContent = 'Bolo pronto!'; depois(600, fim); }
    });
    const surgir = () => {
      const livres = casas.filter(b => !b.dataset.item); if (!livres.length) return;
      const b = livres[Math.random() * livres.length | 0];
      const it = Math.random() < .72 ? BONS[Math.random() * BONS.length | 0] : RUINS[Math.random() * RUINS.length | 0];
      marcar(b, it);
      depois(reduz ? 1900 : 1250, () => { if (b.dataset.item === it) marcar(b, ''); });
    };
    timers.push(setInterval(surgir, reduz ? 900 : 620));
    timers.push(setInterval(() => {
      tempo--; app.querySelector('#tmp').textContent = tempo;
      if (tempo <= 0) { pararJogo(); msg.innerHTML = 'O tempo acabou! <button class="ghost" id="denovo">Tentar de novo</button>'; app.querySelector('#denovo').onclick = () => JOGOS.bolo(fim); }
    }, 1000));
  },
  // 4. Memória: 6 pares com os ícones da aventura
  // Rangel e Ciane: tocar nas entradas do cortejo na ordem certa; depois de 2 erros a próxima brilha
  cortejo(fim) {
    let ordem; do ordem = embaralhar(CORTEJO.map((_, i) => i)); while (ordem.every((v, i) => v === i));
    let prox = 0, erros = 0;
    view(`<p class="kicker">Entradas: <span id="pts">0</span>/${CORTEJO.length}</p><h2>Quem entrou primeiro?</h2>
      <ol class="cortejo-feito" aria-label="Cortejo até agora"></ol>
      <div class="answers cortejo">${ordem.map(i => `<button data-v="${i}">${CORTEJO[i].quem}<small>${CORTEJO[i].musica}</small></button>`).join('')}</div>
      <p class="note" id="msg" role="status">Toque nas entradas na ordem em que aconteceram.</p>`, topoJogo());
    const lista = app.querySelector('.cortejo-feito'), msg = app.querySelector('#msg');
    on('.cortejo button', (v, b) => {
      if (+v === prox) {
        b.remove(); lista.insertAdjacentHTML('beforeend', `<li>${CORTEJO[prox].quem}</li>`);
        prox++; erros = 0; app.querySelector('#pts').textContent = prox; msg.textContent = '';
        if (prox === CORTEJO.length) { msg.textContent = 'Lá vem a noiva! Cortejo perfeito.'; depois(1000, fim); }
        return;
      }
      b.classList.add('errado'); depois(400, () => b.classList.remove('errado'));
      if (++erros >= 2) { app.querySelector(`.cortejo button[data-v="${prox}"]`)?.classList.add('dica'); msg.textContent = 'Dica: a entrada que brilha vem agora.'; }
      else msg.textContent = 'Quase! Essa entrou depois.';
    });
  },
  memoria(fim) {
    const ICONES = PARES.map(p => p[0]), NOME = Object.fromEntries(PARES);
    const cartas = embaralhar([...ICONES, ...ICONES]);
    let abertas = [], pares = 0, jogadas = 0, travado = false;
    view(`<p class="kicker">Pares: <span id="pares">0</span>/${ICONES.length} · jogadas: <span id="jog">0</span></p><h2>Ache os pares!</h2>
      <div class="memoria">${cartas.map((ic, i) => `<button class="carta-mem" data-v="${i}" aria-label="Carta virada"><img src="img/${ic}.webp" alt=""></button>`).join('')}</div>`, topoJogo());
    on('.carta-mem', (v, b) => {
      if (travado || b.classList.contains('virada')) return;
      b.classList.add('virada'); b.setAttribute('aria-label', NOME[cartas[v]]); abertas.push(b);
      if (abertas.length < 2) return;
      jogadas++; app.querySelector('#jog').textContent = jogadas;
      const [a, c] = abertas; abertas = [];
      if (cartas[a.dataset.v] === cartas[c.dataset.v]) {
        a.classList.add('par'); c.classList.add('par'); pares++; app.querySelector('#pares').textContent = pares;
        if (pares === ICONES.length) depois(600, fim);
      } else { travado = true; depois(800, () => { a.classList.remove('virada'); c.classList.remove('virada'); a.setAttribute('aria-label', 'Carta virada'); c.setAttribute('aria-label', 'Carta virada'); travado = false; }); }
    });
  },
  // 5. Sequência: as gemas acendem numa ordem; ela repete. Três rodadas (3, 4 e 5 gemas)
  sequencia(fim) {
    const GEMAS = [['rubi', 'Rubi'], ['esmeralda', 'Esmeralda'], ['safira', 'Safira'], ['topazio', 'Topázio']];
    let rodada = 0, seq = [], pos = 0, ouvindo = false;
    view(`<p class="kicker">Rodada <span id="rod">1</span> de 3</p><h2 id="tit">Observe as gemas...</h2>
      <div class="gemas">${GEMAS.map(([k, n], i) => `<button class="gema ${k}" data-v="${i}" aria-label="${n}"></button>`).join('')}</div>
      <p class="note" id="msg" role="status"></p>`, topoJogo());
    const bt = [...app.querySelectorAll('.gema')], tit = app.querySelector('#tit'), msg = app.querySelector('#msg');
    const acender = (i, ms = 420) => { bt[i].classList.add('acesa'); depois(ms, () => bt[i].classList.remove('acesa')); };
    const mostrar = () => {
      ouvindo = false; pos = 0; tit.textContent = 'Observe as gemas...'; app.querySelector('#rod').textContent = rodada + 1;
      seq.forEach((g, k) => depois(700 + k * 650, () => acender(g)));
      depois(700 + seq.length * 650, () => { ouvindo = true; tit.textContent = 'Agora você! Toque na mesma ordem.'; });
    };
    const nova = () => { seq = Array.from({ length: 3 + rodada }, () => Math.random() * 4 | 0); mostrar(); };
    on('.gema', v => {
      if (!ouvindo) return;
      acender(+v, 220);
      if (+v !== seq[pos]) { ouvindo = false; msg.textContent = 'Nota errada! Olha de novo.'; return depois(900, () => { msg.textContent = ''; mostrar(); }); }
      if (++pos === seq.length) {
        ouvindo = false; rodada++;
        if (rodada >= 3) { tit.textContent = 'Que lindo! Melodia perfeita!'; return depois(700, fim); }
        msg.textContent = 'Isso! Próxima rodada.'; depois(1000, () => { msg.textContent = ''; nova(); });
      }
    });
    nova();
  },
};


// ================= FINAL: o castelo e o prêmio =================
function final() {
  pararJogo(); fecharFala(); painel.hidden = true;
  const f = document.getElementById('final');
  const clarao = document.createElement('div'); clarao.className = 'clarao'; document.body.append(clarao);
  setTimeout(() => {
    f.innerHTML = `<div class="final-cena"><img src="img/final.webp" alt="${ELE}, o escudeiro, esperando no salão do castelo com flores e um bolo de aniversário">
        <div class="final-titulo"><p class="kicker">${FINAL.kicker}</p><h1>${FINAL.titulo}</h1></div></div>
      <div class="card final-carta">
        <div class="carta"><h2 class="title">A carta do escudeiro</h2>${CARTA.map(t => `<p class="abre">${t}</p>`).join('')}<div class="selo" aria-hidden="true">♥</div></div>
        <p class="premio">${FINAL.premio}</p>
        <ul class="vales">${FINAL.vales.map(v => `<li><span aria-hidden="true">🎟️</span> ${v}</li>`).join('')}</ul>
        <p class="despedida">${FINAL.despedida}</p>
        <div class="creditos"><h3>O cortejo desta aventura de uma vida</h3><dl>${CREDITOS.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl><p class="creditos-fim">01/08/2026 · nada acontece por acaso</p></div>
        <div class="actions"><button class="primary" id="vila-de-novo">Voltar à vila</button><button class="ghost" id="recomecar">Jogar a aventura de novo</button></div>
      </div>
      ${reduz ? '' : Array.from({ length: 16 }, () => `<i class="coracao" style="left:${Math.random() * 100}%;animation-delay:${Math.random() * 6}s;animation-duration:${5 + Math.random() * 4}s">${Math.random() < .5 ? '❤️' : '💛'}</i>`).join('')}`;
    f.hidden = false; f.scrollTop = 0;
    fanfarra(); confete(); setTimeout(confete, 2200);
    f.querySelector('#vila-de-novo').onclick = () => { f.hidden = true; };
    f.querySelector('#recomecar').onclick = () => { try { localStorage.removeItem(CHAVE); } catch {} f.hidden = true; cap = -1; xp = 0; Object.assign(heroi, INICIO); start(); };
    f.querySelector('#vila-de-novo').focus({ preventScroll: true });
  }, reduz ? 0 : 450);
  setTimeout(() => clarao.remove(), 1400);
}

const bg = document.getElementById('bg');
if (reduz || navigator.connection?.saveData) { bg.removeAttribute('autoplay'); bg.preload = 'none'; bg.pause(); }
montarMundo();
start();
</script>
